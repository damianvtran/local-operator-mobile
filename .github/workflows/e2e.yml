name: E2E (mock relay, audit and Maestro)

# The end-to-end and design-audit layers, wired to the harness that owns them.
#
# EVERY COMMAND BELOW GOES THROUGH THE HARNESS'S OWN PACKAGE SCRIPTS
# (`pnpm e2e:relay`, `pnpm audit:capture`, `pnpm e2e:canary`, …), which are the
# interface `docs/e2e/ci-notes.md` publishes — not through file paths. That is
# deliberate and it is round 2's M1: this workflow was first written against
# `tools/**/*.mjs` names the harness had already renamed to `*.ts`, so every
# command here would have failed the moment the harness merged. A script name
# survives a rename; a path does not. The harness is plain Node with no
# dependencies, so most of this workflow needs a checkout and nothing else.
#
# A MISSING HARNESS IS A FAILURE, NOT A SKIP. The `harness` job checks for the
# package scripts and the Maestro flows, and FAILS — naming every missing piece —
# rather than skipping the suites behind it, because a green conclusion would
# claim the relay contract, the frame audit and the canary had run when none of
# them had. Until the harness lands, this workflow is red on every ref, which is
# the honest state: what it exists to run is not in the tree.
#
# ONE RETRY, AND ONLY FOR THE FLOWS (ADR 0004). Maestro 2.11.0's CLI has no retry
# option — `--retry` fails at argument parsing — so the flow run re-runs the set
# once itself and raises a `::warning` when it flaked: the retry is reported
# separately so a flake is visible as a flake. Nothing else in the repository
# retries.
#
# WHAT IS DELIBERATELY NOT HERE, rather than quietly missing:
#   * the **re-capture diff** (ADR 0003, §6 of the harness notes). It needs an
#     isolated `lop mobile` and therefore the Python toolchain, and the script
#     ADR 0003 requires does not exist yet — there is nothing to wire.
#   * **Maestro on an iOS simulator.** The harness documents the invocation, and
#     the flows are platform-parameterised, but the emulator job is the most
#     expensive thing this repository runs and it should be green for a while
#     before a second copy of it exists on macOS minutes. It is a follow-up, not
#     a silent gap: docs/ci.md says so too.

on:
  workflow_dispatch:
  schedule:
    # Nightly, off-peak: the emulator job is the slowest thing here and the least
    # useful on a branch nobody is waiting for.
    - cron: "17 3 * * *"
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  # Pinned explicitly. The Maestro installer accepts a version and otherwise
  # installs "latest", and a mobile-e2e job whose driver changes silently between
  # two runs is a job whose failures cannot be attributed to anything.
  MAESTRO_VERSION: "2.11.0"
  # Android 16, which is what Google requires of new apps and updates since
  # 2026-08-31 (ADR 0004).
  MAESTRO_API_LEVEL: "36"
  # The scenario the mock relay is started with, named in ONE place so the
  # capture, the audit and the flows all describe the same state — the harness
  # notes are explicit that running them against different states makes the
  # numbers mean nothing. `idle` is the relay's own default.
  MOCK_RELAY_SCENARIO: idle

jobs:
  harness:
    name: Is the audit harness present? (fails if it is not)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Detect the harness
        # A GREEN RUN OF THIS WORKFLOW MUST MEAN THE SUITES RAN. Until this step
        # could fail, a tree without `tools/` produced `success` with every suite
        # `skipped` — a green tick on a suite that did not run (review M1). The
        # harness is what this workflow exists to run (ADR 0003,
        # `docs/e2e/ci-notes.md`), so its absence is a failure of the workflow's own
        # premise.
        #
        # IT CHECKS THE HARNESS'S INTERFACE, NOT ITS FILE NAMES, and that is the fix
        # for round 2's M1: this workflow was written against `*.mjs` paths the
        # harness had already renamed to `*.ts`, so every command here would have
        # failed the moment #8 merged and "it resolves itself when #8 lands" was
        # false. The package scripts (`e2e:relay`, `e2e:typecheck`, `audit:capture`, …)
        # are the interface #8 documents in `docs/e2e/ci-notes.md`, and they survive a
        # rename — the same reason every other command in this pipeline goes through
        # a package script rather than a path.
        id: detect
        run: |
          set -euo pipefail
          missing=()
          for script in e2e:relay e2e:divergences e2e:canary e2e:typecheck e2e:docs audit:capture audit:run mock:relay; do
            node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$script" \
              || missing+=("package script $script")
          done
          if ! find e2e/maestro -name '*.yaml' -print -quit 2>/dev/null | grep -q .; then
            missing+=("e2e/maestro/**/*.yaml")
          fi
          {
            echo "## End-to-end harness"
            echo
            if [ ${#missing[@]} -eq 0 ]; then
              echo "Every piece of the harness is present; the suites below ran."
            else
              echo "**The harness is not in this tree.** Missing:"
              echo
              for piece in "${missing[@]}"; do echo "- \`$piece\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the audit harness is not in this tree: ${missing[*]}. This workflow exists to run it (ADR 0003, docs/e2e/ci-notes.md) and it ships in its own change, so this is a real failure of the pipeline rather than a reason to skip: a green conclusion here would claim the mock relay, the frame audit and the canary had run when none of them had."
            exit 1
          fi
          echo "the harness is present in full: its package scripts and its Maestro flows"

  mock-relay-contract:
    name: Mock relay contract and divergence checks
    needs: harness
    runs-on: ubuntu-latest
    # BOUND SIZED FROM A MEASUREMENT, NOT FROM HOPE (review round 3, M3). The
    # harness documents `pnpm e2e:relay` as its slowest documented command, and its
    # "runtime is LOAD-DEPENDENT: 28 minutes measured on this host at load averages
    # 32-46, ~13 minutes on a quiet one" (`tools/lib/doc-commands.ts`, `--timeout
    # 2700`), and `tools/mock-relay/verify.ts` says "a healthy run takes 28 minutes
    # on this host at load averages 32-46 (~13 minutes quiet)". A reviewer's own
    # attempt on this host was killed at ~14 minutes *inside* the mutation group, on
    # a machine at load 120-226. The 15-minute job bound this replaces could
    # therefore only ever report a timeout.
    #
    # THE BOUND COVERS THE JOB'S PARTS, NOT ITS LARGEST ONE (review rounds 4's m1 and
    # 5's N5-1): the invariant is `install + 25 + 10 < 45`. At 40 the install was
    # left five minutes, which is the one term with no measurement of its own — the
    # file's number is 631 packages / ~746 MB — so a slow install would have been
    # cancelled by the runner's generic maximum-execution-time line instead of a step
    # naming itself, which is the failure the bound was raised for in the first
    # place. The install prints its own duration, so the next person sizing this has
    # a measurement rather than an estimate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # AN EXPLICIT INSTALL, because an implicit one was already happening: pnpm
        # 12's `verify-deps-before-run` defaults to `install`, so the "no install"
        # version of this job ran `pnpm e2e:relay` and pulled 631 packages into a
        # tree that had none — a 746 MB `node_modules`, created without
        # `--frozen-lockfile`, which is the one property every other job in this
        # repository is careful about (round 3 addendum, measured). Making it
        # explicit keeps the lockfile guarantee and puts the cost inside the budget
        # where it can be seen.
        run: |
          set -euo pipefail
          start=$(date +%s)
          pnpm install --frozen-lockfile
          echo "install took $(( $(date +%s) - start ))s (631 packages / ~746 MB measured on a "
          echo "cold store; cached, it is seconds). This is part of the job's 45-minute bound."

      # The mock's own proof: every assertion the verifier makes over the relay's
      # contract, which is what keeps the mock from drifting away from the relay it
      # re-implements. It prints its own assertion count — read that line rather than
      # a number written down here, which would drift the first time a check is
      # added. Bounded inside the job's bound so a hang names this command instead of
      # leaving a cancelled job with no output.
      - name: Assert the mock relay's contract
        timeout-minutes: 25
        run: pnpm e2e:relay

      - name: Assert the harness agrees with the relay where it diverges on purpose
        # Bounded like the contract above: a hang here should name this check rather
        # than leave the job to be cancelled with no output.
        timeout-minutes: 10
        run: pnpm e2e:divergences

  docs-commands:
    name: Every command the harness documents (nightly and on demand)
    needs: harness
    # WHY THIS IS NOT ON THE PULL-REQUEST PATH (`if:` below). It runs the whole of
    # `docs/e2e/README.md`, whose slowest entry is the relay contract — ~28 minutes
    # by the harness's own note — and that command already has its own job above. On
    # a pull request the sweep would run the relay contract a second time for no
    # extra coverage; nightly it is exactly the check worth having, because it is the
    # one that fails when a tool is renamed or a documented invocation goes stale
    # (review m2's other half, and round 3's M3 for the bound).
    #
    # It exports the web build first, because some documented commands declare a
    # `web-build` prerequisite — but THE EXPORT ALONE DOES NOT STOP THEM SKIPPING.
    # `tools/lib/doc-commands.ts` marks such a block runnable only when `--dist`
    # supplies the build, and this job does not pass it (the export step carries the
    # measurement of what happens when it does). So they print SKIP *with the reason*
    # rather than pretending, which names what was not proven — and their tool paths
    # and script names are still resolved, so a skip cannot hide a renamed file.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export the web target
        # Same reason as `web-audit`: the harness drives the export, and the
        # documented commands that need one are skipped without it.
        #
        # THE BUILD IS NOT HANDED TO THE SWEEP, ON PURPOSE. `doc-commands.ts` marks a
        # `web-build` block runnable only when `--dist` supplies the build, so as the
        # step stands every such block prints SKIP — `pnpm export:web` above has no
        # effect on what the sweep runs. That was measured, and so was the reason it is
        # not simply fixed here: dispatching this workflow with `--dist dist` runs the
        # two build-gated captures for the first time, and §2's (`L549`) EXITS 1 on the
        # runner with `1 undeclared identical-state pair(s)` — a real finding that
        # passes on macOS, so enabling the plumbing needs that pair fixed or declared
        # first (run 37238085957, job 111541147842). Until then SKIP is the honest
        # state: it names what was not proven rather than reporting green over it.
        timeout-minutes: 15
        run: pnpm export:web

      - name: Run every documented command
        # THE OUTER BOUND MUST OUTLIVE THE INNER ONE. `tools/lib/doc-commands.ts`
        # bounds each documented command at 45 minutes (`--timeout 2700`), and that
        # default sits strictly above `verify.ts`'s own 2,400 s watchdog so the inner
        # bound fires first and names the command it killed — at equal values the two
        # race and the outer one reports a generic timeout instead. The command's
        # default therefore cannot be lowered below 40 minutes, so the STEP is what
        # moves above it: 50 here, and the job to 70 to hold the export (15) and the
        # install ahead of it. At 40 this step sat BELOW the command's own default,
        # which is a bound under the work it contains.
        timeout-minutes: 50
        # NOT `--dist dist`: see the export step above for the measured reason.
        run: pnpm e2e:docs

  web-audit:
    name: Web target — frames, audit and the canary
    needs: harness
    # LINUX, not macOS. This job ran on `macos-26` only because the harness's
    # Chrome discovery was hard-coded to `/Applications/Google Chrome.app/...` and
    # failed on a Linux runner; `tools/lib/chrome.ts` now tries `/usr/bin/
    # google-chrome`, `google-chrome-stable` and finally PATH, so the macOS spend
    # (the pipeline's scarcest resource) is gone. It is unproven until the harness
    # lands and this job first runs for real — if that run cannot find a browser,
    # the fix is this one line, and the run will say so rather than pass.
    runs-on: ubuntu-latest
    # The capture matrix is minutes; the bound is the diagnosis, not the budget.
    # THE BOUND COVERS THE JOB'S PARTS, NOT ITS LARGEST ONE — and it has to name EVERY
    # part, which the form it used to carry did not. Measured on the runner
    # (run 37379067992, this job, the tiers as they stand): setup and checkouts 21 s +
    # install 4 s + typecheck 1 s + EXPORT 34 s + RELAY START 1 s + capture 1044 s +
    # canary 81 s + stop relay 0 s + upload of the 91 MB artifact 6 s = 1192 s, the job's
    # whole measured wall time, plus the audit at its own measured rate — 948 cells x
    # 1.25 s = 1,185 s, which is DERIVED rather than taken from that run, whose capture
    # failed the identical-state gate before the audit step ran. That is ~2,377 s ≈ 40
    # min against the 85 below, so the bound is ~2.1x the work: the headroom is the point.
    # THE OLD FORM WAS FALSE, not merely imprecise:
    # `install + typecheck 10 + capture 40 + audit 20 + canary 5 < 80` sums to exactly
    # 60, so `< 60` is untrue, and it omits the export and the relay start entirely —
    # ~35 s of real work, and two steps a reader would have no account of when sizing
    # the next raise. The per-step bounds are CEILINGS, not a budget, and they are
    # deliberately not additive: what keeps the job inside 60 is the measured work
    # above, which is why the measurement is stated here instead of a sum. The capture
    # and audit parts rose when `CI_SCALES` gained the boundary step (336 -> 504 cells):
    # a budget the per-push path now pays deliberately, because an axis that BRACKETS
    # the band the footer breaks in cannot see that class of defect, and it reached
    # review once already. THEY ROSE AGAIN with the projects lifecycle slice, which
    # added ten declared cells (504 -> 612 on `ci`, 1512 -> 1836 on `core`, 5544 ->
    # 6732 on `full`), and round 3's remediation one more (`S15/menu-open`, the pane's
    # long-press menu: 612 -> 624, 1836 -> 1872, 6732 -> 6864), the fold onto the
    # moved base two more from upstream (`S5/populated-long`, `S5/rich-rows`), the
    # find slice's five cells more (696 -> 756, 2088 -> 2268, 7656 -> 8316), the
    # schedules fold's five S17 cells one more (the armed index's five states: 756 ->
    # 816, 2268 -> 2448, 8316 -> 8976), the mesh slice's seven cells one more (the
    # S15 remote rows, the tap-reveal and the move sheet's five states: 816 -> 900,
    # 2448 -> 2700, 8976 -> 9900), and the checkpoint rail's four more, folded from
    # main (900 -> 948, 2700 -> 2844, 9900 -> 10428): the plans at THIS head are
    # 948 / 2844 / 10428,
    # each re-derived from the folded tree's own `--plan` rather than scaled. Those
    # cells are states
    # that had no cell at all — the create sheet,
    # its relay refusal, the milestone editor, the remove confirm, the slash refusal
    # and the in-flight writes — so shrinking them is not an option the way a scale or
    # a device is, and the numbers above are re-derived from this head's own `--plan`
    # rather than scaled.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the harness
        # Review m2, and the harness's own §0: `pnpm typecheck` covers the app and
        # `scripts/**`, so `tools/**` and `e2e/**` would otherwise be checked by
        # nothing. This is their gate, and it is seconds.
        #
        # `e2e:docs` USED TO RUN HERE AND NO LONGER DOES. It executes every command
        # `docs/e2e/README.md` names, and the slowest of those is `pnpm e2e:relay` —
        # ~28 minutes by the harness's own note — so a 5-minute step bound could only
        # ever report a timeout, while the relay command already has a job of its own
        # above (review round 3, M3: the command also ran twice per push). The
        # documented-command sweep still runs, nightly, in `docs-commands`.
        timeout-minutes: 10
        run: pnpm e2e:typecheck

      - name: Export the web target
        # The harness drives the EXPORT, not a dev server: the export is what a
        # reviewer's bundle would be, and a dev server's on-the-fly transform is a
        # second variable in a job whose whole point is reproducibility.
        run: pnpm export:web

      - name: Start the mock relay on an ephemeral port
        # One relay per job, on a port the OS picks (never the operator's own
        # 4098), printing the port alone on stdout. Diagnostics go to a file: a
        # background process holding the step's stdout open is how a CI job hangs.
        run: |
          set -euo pipefail
          pnpm mock:relay \
            --scenario "${{ env.MOCK_RELAY_SCENARIO }}" \
            --print-port --quiet \
            < /dev/null > "$RUNNER_TEMP/relay.port" 2> "$RUNNER_TEMP/relay.err" &
          echo $! > "$RUNNER_TEMP/relay.pid"
          for _ in $(seq 1 60); do
            port=$(head -1 "$RUNNER_TEMP/relay.port" 2>/dev/null || true)
            case "$port" in ''|*[!0-9]*) sleep 0.5 ;; *) break ;; esac
          done
          port=$(head -1 "$RUNNER_TEMP/relay.port")
          case "$port" in ''|*[!0-9]*) echo "::error::the mock relay never printed a port"; cat "$RUNNER_TEMP/relay.err"; exit 1 ;; esac
          echo "MOCK_RELAY_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "mock relay: http://127.0.0.1:$port (pid $(cat "$RUNNER_TEMP/relay.pid"))"

      - name: Capture the frames
        # BOUNDED PER STEP, not just per job. A capture that hangs would otherwise
        # consume the whole job budget and report nothing: measured on 2026-09-30,
        # this step ran over 90 minutes inside a 45-minute job timeout (run
        # 36669731994) without GitHub reaping it, so the run said only that it was
        # still going. Measured again on 2026-10-03 (run 37098393675), the capture
        # costs 2.24 s/cell — 403 cells / 1209 frames in 903.1 s — so the `core`
        # plan of 2844 cells needs ~106 min and cannot finish inside this bound. The
        # `--tier ci` sample can: 948 cells, ~35 min at the same rate, which leaves
        # the audit and the canary their own steps below. (`full` is 10428 cells, and
        # stays a dispatched or local run.)
        #
        # RAISED 20 -> 30 WITH THE CI AXIS, and the two move together: `CI_SCALES`
        # gained the boundary step (135), so this sample became 504 cells rather than
        # 336. 30 is above the plan's own derived deadline (504 x 3 s = 25.2 min), which
        # is the property the step bound has to keep — a bound that fires every run
        # stops being a signal — and ~1.6x the measured cost, the headroom the other
        # steps here carry.
        #
        # RAISED 30 -> 40 WITH THE LIFECYCLE CELLS, THEN 40 -> 45 WITH THE FOLD, THEN
        # 45 -> 50 WITH THE MESH CELLS, THEN 50 -> 55 WITH THE CHECKPOINT RAIL'S FOUR
        # FOLDED FROM MAIN, for exactly that property: the lifecycle cells put this
        # sample at 648 (648 x 3 s = 32.4 min at that rate), the fold onto the moved
        # base left it at 696 (34.8 min), the find slice's five cells took it to 756
        # (37.8 min), and the schedules fold's five S17 cells one more took it to 816
        # (40.8 min) — a derived deadline of 816 x 3 s = 40.8 min, ABOVE the 40 the step
        # had carried, so the bound moved to 45 — and the mesh slice's seven cells one
        # more to 900 — a derived deadline of 900 x 3 s = 45 min, which EQUALED the 45
        # the sample carried, so the bound moved to 50 rather than being left AT the
        # deadline: a step bound the plan's own deadline can reach would fire on a
        # healthy run and stop being a signal, and 50 still held ~1.5x the measured
        # cost (900 x 2.24 s ≈ 33.6 min). The checkpoint rail's four more, folded from
        # main, took it to 948 — a derived deadline of 948 x 3 s = 47.4 min, leaving
        # the 50 only 2.6 min of room — so the bound moved 50 -> 55, keeping the same
        # ~1.5x over the measured cost (948 x 2.24 s ≈ 35.4 min).
        timeout-minutes: 55
        # THE DOCUMENTED INVOCATION, through the harness's own script
        # (`docs/e2e/ci-notes.md` §3). An earlier version derived the cell list here
        # and passed `--cells`, working around a mismatch between what the capture
        # asked the relay for and what the relay served; the harness fixed that at
        # the source — its own `relayState()` reads the scenario registry — so the
        # workaround is gone and this is one command with the flags the notes name.
        #
        # `--tier` is named rather than left to the default, because the default is
        # `core`: the tier is what keeps the sample, the plan and the manifest
        # reading one list declared in the harness (`tools/visual/matrix.ts`) rather
        # than a range spelled out here that the harness cannot see. The count is
        # printed with the plan, so a reviewer can check this file against the run
        # rather than trust it.
        #
        # Frames are written outside the repository and uploaded — never committed
        # (ADR 0003).
        run: pnpm audit:capture --dir dist --out "$RUNNER_TEMP/frames" --relay "$MOCK_RELAY_URL" --tier ci --consecutive --yes

      - name: Audit the frames against the rubric
        timeout-minutes: 25
        # BOUND DERIVED FROM THE CELL COUNT, not guessed. On run 37167390506 this
        # step audited 250 of the ci tier's 256 cells in 312 s — 1.25 s/cell, with
        # no FAIL row — so the tier as it stood then was 256 x 1.25 s = ~5.3 min. It
        # plans 948 cells today (948 x 1.25 s = 1,185 s ≈ 20 min) and 25 gives ~1.27x
        # headroom over that; 20 had fallen to ~1.2x, thinner than this bound has ever
        # carried, and the fold's cells are what moved it; it moved 10 -> 15 with
        # the capture above when `CI_SCALES` gained the boundary step, and 15 -> 20 with
        # the lifecycle cells (504 -> 612), and 20 -> 25 with the fold's cells (756 ->
        # 816) — kept at 25 by the mesh slice's seven (816 -> 900) and the checkpoint
        # fold's four (900 -> 948). At 5 it was killed with six cells to go: a bound below the
        # work it contains, the same shape that made the capture's deadline derive
        # from its own plan. It is DERIVED, not COMPUTED at runtime: GitHub evaluates
        # `timeout-minutes` before any step runs, and the count that matters is the
        # captured manifest's, which does not exist until the step above finishes.
        # Exits non-zero on any FAIL row. BLOCKED rows are reported and counted
        # rather than failing the job — an app whose type ignores the root
        # font-size is a finding for the review thread, not a broken harness.
        run: pnpm audit:run --manifest "$RUNNER_TEMP/frames/manifest.json" --out "$RUNNER_TEMP/audit"

      - name: Run the canary
        # ALWAYS, AND STILL PLAIN OTHERWISE. The audit step above exits 1 on real app
        # findings (the U-05/U-08 geometry rows at 200 %), and a step with no `if:`
        # after a failing one is SKIPPED — verified in run 37177701601, where the
        # audit's exit 1 left the canary unrun. That silently retires the mutation
        # self-test exactly while the gate is red, and a self-test that cannot run is
        # indistinguishable from one that was not needed. No `continue-on-error` and no
        # `|| true`: the canary still fails the job when it fails. It needs nothing the
        # steps above produce (it captures its own fixture matrix), so it can run on a
        # red audit.
        if: always()
        timeout-minutes: 5
        # The gate that stops the audit rotting into a rubber stamp: the fixture
        # page declares its own defects, so this fails if the audit stops catching
        # them, starts failing the clean page, or if the harness's own scale
        # dimension goes inert.
        run: pnpm e2e:canary

      - name: Stop the mock relay
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/relay.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/relay.pid")
            # By exact pid, and only the one this job started.
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
            kill -9 "$pid" 2>/dev/null || true
          fi
          echo "relay stopped; any remaining listener on the port was never this job's"

      - name: Upload the frames, the manifest and the audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-frames
          path: |
            ${{ runner.temp }}/frames
            ${{ runner.temp }}/audit
          retention-days: 30

  web-audit-core:
    name: Web target — the core device sample (nightly and on demand)
    needs: harness
    # WHY THIS JOB EXISTS. The operator's requirement is QA "across a variety of different
    # device sizes of phone … and tablets both vertical and horizontal", and until this job
    # nothing automated covered it: the per-push `web-audit` job runs `--tier ci`, which is
    # 2 of the matrix's 19 declared profiles, and both `core` (5 profiles / 2844 cells) and
    # `full` (19 / 10428) were local or dispatched only. This job captures and audits `core`,
    # on the NIGHTLY schedule only, so the per-push path is untouched and the `ci` job keeps
    # its own 55-minute capture bound rather than being stretched to fit a 106-minute one.
    #
    # SIZED FROM THE MEASUREMENT, NOT FROM HOPE. The runner's own rate is 2.24 s/cell
    # (403 cells / 1209 frames in 903.1 s, run 37098393675, a plan of 403 cells then),
    # which is also the number `docs/e2e/README.md` uses to say a `core` run is ~106
    # minutes: 2844 cells x 2.24 s = 6,371 s.
    # The plan this job holds is the one the capture prints before it renders anything, so
    # the bound is checked against THAT rather than against a table, and each plan is
    # pinned to the ref that printed it: at 85b2785 `--plan --tier core --consecutive`
    # printed 858 cells x 3 frame(s) = 2574 frames (85b2785, a plan of 858 cells then)
    # with a derived deadline of 2574 s (85b2785), and
    # at THIS head it prints `2844 cells x 3 frame(s) = 8532 frames` and `deadline: 8532 s`
    # (3000 ms/cell). The capture step's 150 is above both derived deadlines (so the step
    # cannot cut short the budget the run computed for itself) and ~1.4x the ~106 min the
    # 2844 cells cost at 2.24 s/cell. It moved 95 -> 100 in round 3, and 100 -> 110 in
    # round 5: the fold's four extra cells took the derived deadline to 6264 s = 104.4 min,
    # ABOVE the 100 the job had carried, and a bound below its own deadline is the defect
    # this comment refuses one level up — the step would cut short the budget the run
    # computes for itself. It moved 110 -> 125 with the fold's ten cells (the find
    # slice's five and the schedules slice's five S17 cells), which put the derived
    # deadline at 7344 s = 122.4 min, above the 110 the job had carried — and the job
    # bound moved 170 -> 190 with it, so capture + audit still sits inside it without
    # closing it exactly (`125 + 60 = 185 < 190`). The mesh slice's seven cells moved
    # capture 125 -> 140, which put the derived deadline at 8100 s = 135 min, above the
    # 125 the step had carried; and the checkpoint rail's four more, folded from main,
    # took it to 8532 s = 142.2 min — ABOVE the 140 the step now carried — so capture
    # moved 140 -> 150, with the audit bound 60 -> 70 and the job bound 190 -> 225
    # (`150 + 70 = 220 < 225`). The per-push steps carry the same relationship: capture
    # 55 against a derived 2844 s (47.4 min) and audit 25 against 948 x 1.25 s (20 min).
    # The audit runs at 1.25 s/cell (250 of the 256 cells the tier held then in 312 s, run
    # 37167390506), so `core` is 2844 x 1.25 s = 3,555 s ≈ 59 min and its step bound is 70.
    # The job bound holds its parts, the invariant the other jobs in this file state:
    # `install + export + capture 150 + audit 70 < 225`. This is a nightly job of ~106 min of
    # capture and ~59 min of audit inside that bound; it does not run on a pull request.
    #
    # EXPECTED FIRST-RUN VERDICT: THIS JOB IS RED, AND THAT IS WHAT IT IS FOR. It has
    # never executed (schedule/dispatch only). A real local `--tier core --consecutive`
    # run exits 1 in BOTH steps, and every term of that exit reproduces identically at
    # 85b2785, where the app, the audit and the design kit are byte-identical to this
    # head: `git diff --stat 85b2785..<this-head> -- app src store design public
    # tools/audit` is empty. That range is NOT empty under `tools/` — this PR's own
    # changes are there — and the only one of them that could in principle decide a
    # canvas comparison is the padded-token trim, which is inert for the shipped token
    # file: its two canvases are already unpadded — checked, not assumed: reading them
    # back gives each value equal to its own trim, and a test now pins the padded fixture
    # onto the shipped value — so no displayed colour moves.
    # THE TWO RUNS BELOW ARE RECORDS, PINNED TO THE PLAN THEY WERE MEASURED ON rather
    # than re-derived: they ran on the 858-cell plan (which `85b2785` prints, and where
    # every term reproduces). The head they were taken at (`15deac3`) planned 504 cells on
    # `ci` and 1512 on `core` — re-derived with `--plan` AT THAT REF, and NOT the 1092 this
    # sentence used to quote: 1092 is not any tier's plan at any ref the review derived
    # (85b2785 264/858, 4649a08 884, 756a6af 910, 15deac3 504/1512, this head 948/2844), it
    # came in with the PR that wrote the paragraph, and a figure nothing prints is a figure
    # nobody can check. The plans at THIS head are in the SIZING note above, each with the
    # ref that prints it.
    #   * capture: `captured 858 cells / 2574 frames in 1810.8 s`, rc 1 on FOUR unready
    #     cells — `S15/loading` and `S4/idle`, both themes, at `iphone-15-landscape` and
    #     200 % (`median text 34.796875px at 200% against 1.74x the 100% cell (needs
    #     >=1.9x)`) — and two identical-state collapses, `S15/ended = S15/populated` on
    #     `iphone-15-landscape`. Its `theme problems` line is `none`: the resolved-scheme
    #     check added with this job does not fire on it.
    #   * audit: `858 cells, 13316 check rows, 9530 measured, 2326 FAIL, 3786 BLOCKED
    #     (140 unmeasurable)`, rc 1, every FAIL row a U-05 one at `iphone-15-landscape`
    #     (816/804/706 at scales 100/150/200), in 1,161 s against the 35-min bound the step
    #     then had.
    # Those are real app-side findings the per-push `ci` sample cannot reach (it never
    # captures `iphone-15-landscape`), which is the reason this job exists. So: do NOT add
    # `continue-on-error` and do NOT exempt or silence a cell — a job that reports a real
    # finding is working, and this comment is where a reader finds out that the red is the
    # finding rather than a broken job. Clearing them is an app-side fix with its own PR.
    # NOT yet verified, and not claimed here: whether a GitHub runner reproduces these
    # metric-sensitive results. That needs a `workflow_dispatch`; the figures above are
    # measured on this host.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `e2e:typecheck` here: it is the per-push gate and already ran on the commit this
      # schedule fires from. This job exists to add device coverage, not to re-check types.
      - name: Export the web target
        run: pnpm export:web

      - name: Start the mock relay on an ephemeral port
        # One relay per job, on a port the OS picks (never the operator's own 4098), printing
        # the port alone on stdout. Diagnostics go to a file: a background process holding the
        # step's stdout open is how a CI job hangs.
        run: |
          set -euo pipefail
          pnpm mock:relay \
            --scenario "${{ env.MOCK_RELAY_SCENARIO }}" \
            --print-port --quiet \
            < /dev/null > "$RUNNER_TEMP/relay.port" 2> "$RUNNER_TEMP/relay.err" &
          echo $! > "$RUNNER_TEMP/relay.pid"
          for _ in $(seq 1 60); do
            port=$(head -1 "$RUNNER_TEMP/relay.port" 2>/dev/null || true)
            case "$port" in ''|*[!0-9]*) sleep 0.5 ;; *) break ;; esac
          done
          port=$(head -1 "$RUNNER_TEMP/relay.port")
          case "$port" in ''|*[!0-9]*) echo "::error::the mock relay never printed a port"; cat "$RUNNER_TEMP/relay.err"; exit 1 ;; esac
          echo "MOCK_RELAY_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "mock relay: http://127.0.0.1:$port (pid $(cat "$RUNNER_TEMP/relay.pid"))"

      - name: Capture the frames (the core device sample)
        # `--tier core` names the sample the run states for itself: the capture prints its own
        # device coverage, so this job's log says which of the 19 declared profiles it covered
        # and which it did not, rather than leaving a green job to read as the whole matrix.
        # 150 (not 140): the mesh slice's seven cells and the checkpoint rail's four,
        # folded from main, together took the plan's own derived deadline to
        # 8532 s = 142.2 min, and a step bound the plan's deadline can exceed would cut
        # short the budget the run computes for itself.
        timeout-minutes: 150
        run: pnpm audit:capture --dir dist --out "$RUNNER_TEMP/frames" --relay "$MOCK_RELAY_URL" --tier core --consecutive --yes

      - name: Audit the frames against the rubric
        timeout-minutes: 70
        run: pnpm audit:run --manifest "$RUNNER_TEMP/frames/manifest.json" --out "$RUNNER_TEMP/audit"

      - name: Stop the mock relay
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/relay.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/relay.pid")
            # By exact pid, and only the one this job started.
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
            kill -9 "$pid" 2>/dev/null || true
          fi
          echo "relay stopped; any remaining listener on the port was never this job's"

      - name: Upload the frames, the manifest and the audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # A distinct name from the per-push `audit-frames`: on a nightly run both jobs
          # upload, and one name would make the second upload fail rather than attach.
          name: audit-frames-core
          path: |
            ${{ runner.temp }}/frames
            ${{ runner.temp }}/audit
          retention-days: 30

  maestro-android:
    name: Maestro flows on an Android 16 emulator
    needs: harness
    # NIGHTLY AND ON DEMAND, not per push: the harness's own note says "nightly and
    # release gate", and ADR 0003's risk table limits emulator flows for the same
    # reason — they are the slowest, flakiest part of the pipeline and the least
    # informative on a branch somebody is iterating on.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM (the emulator's hardware acceleration)
        # WHY: GitHub-hosted Ubuntu runners can run the Android emulator on KVM, but
        # they ship /dev/kvm with the runner user outside its owning group, so an
        # unmodified job silently degrades to software emulation (measured: a
        # ~15-minute boot, ~40-minute runs, and no flow output). This is the recipe
        # GitHub's changelog for hardware-accelerated Android virtualization publishes
        # (2024-04-02) and the emulator action's README carries: make the device
        # world-readable/writable. Placed before the build so a KVM-less runner fails
        # in seconds in the check below, not after the APK build.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assert the emulator can use KVM (fail fast, and name KVM)
        # WHY: a runner that cannot open /dev/kvm must fail HERE, naming KVM — never
        # as "no flow output" forty minutes later, which reads like an app failure.
        # This mirrors the action's own check before it decides to fall back to
        # software emulation: accessSync('/dev/kvm', R_OK | W_OK).
        run: |
          set -euo pipefail
          echo "runner user: $(id -un); groups: $(id -Gn)"
          if [ ! -e /dev/kvm ]; then
            echo "::error title=KVM unavailable::/dev/kvm does not exist on this runner, so the Android emulator cannot use hardware acceleration — a software-emulated run is not a valid test of this app."
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            ls -l /dev/kvm
            echo "::error title=KVM unavailable::/dev/kvm is not readable+writable by the runner user $(id -un); the emulator would silently fall back to software emulation."
            exit 1
          fi
          echo "KVM is usable: $(ls -l /dev/kvm)"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the APK the flows run against
        # WHY RELEASE AND NOT DEBUG: a Debug build of a React Native app expects
        # a Metro dev server at runtime — this job starts no dev server, so the
        # launched app renders a red error screen and the flows then assert
        # against a UI that does not exist. ios.yml states the rule for its own
        # simulator job: "a Debug build of a React Native app expects a Metro
        # dev server at runtime … it renders a red error screen. A Release build
        # embeds the JavaScript bundle, so the launched app renders the real UI."
        #
        # WHY THIS JOB GENERATES ITS OWN KEY: the workflow carries no signing
        # material and must not get any. The release signing plugin
        # (plugins/with-android-release-signing.js) deliberately fails loudly
        # without LO_RELEASE_* material rather than fall back to the debug key,
        # so this job generates a throwaway keystore for the emulator install
        # only. The real signing stays in release.yml, where the secrets live.
        #
        # Built here rather than downloaded from the Android workflow: that job
        # uploads the debug, Metro-dependent APK, and a cross-workflow artefact
        # download would couple two independent triggers.
        run: |
          set -euo pipefail
          pnpm exec expo prebuild --platform android --clean --no-install
          keystore="$RUNNER_TEMP/e2e-release.keystore"
          keytool -genkeypair -v -keystore "$keystore" -alias lo-e2e \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass lo-e2e-ci -keypass lo-e2e-ci \
            -dname "CN=lo-e2e, OU=ci, O=local-operator, C=US"
          cd android
          LO_RELEASE_STORE_FILE="$keystore" \
          LO_RELEASE_STORE_PASSWORD=lo-e2e-ci \
          LO_RELEASE_KEY_ALIAS=lo-e2e \
          LO_RELEASE_KEY_PASSWORD=lo-e2e-ci \
            ./gradlew assembleRelease --no-daemon

      - name: Read the app's identity from the APK it just built
        # The flows are told the APP_ID they should launch, and until this step
        # existed that value was the harness's own default
        # (`com.radient.localoperator.mobile`) while the app the build produces is
        # `com.localoperator.mobile` (app.config.ts). Two bundle ids in one
        # repository is a bug whichever one is right — and the right one for the
        # pipeline is whatever the build actually produced, because that is the
        # app installed on the emulator. Reading it out of the APK removes the
        # second copy entirely, and the bundle id itself stays an operator
        # decision rather than something CI invents. The flows deliberately
        # declare no `APP_ID` default of their own, for this reason: Maestro
        # 2.11.0 applies a flow-level `env:` value after the CLI's `-e` values
        # and overwrites them, so a committed default would silently beat this
        # step's value.
        run: |
          set -euo pipefail
          aapt=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name aapt2 -type f | sort | tail -1)
          echo "aapt2: $aapt"
          package=$("$aapt" dump badging android/app/build/outputs/apk/release/app-release.apk \
            | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)
          if [ -z "$package" ]; then
            echo "::error::could not read the package name out of the release APK"
            exit 1
          fi
          echo "APP_ID=$package" >> "$GITHUB_ENV"
          echo "app under test: $package"

      - name: Restore the Android AVD
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: ${{ runner.os }}-avd-${{ env.MAESTRO_API_LEVEL }}-${{ hashFiles('e2e/maestro/**') }}

      - name: Install the pinned Maestro CLI
        # The one `curl | bash` this repository allows (ADR 0004), and
        # MAESTRO_VERSION is what keeps it from being "latest".
        run: |
          set -euo pipefail
          export MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Write the relay password the flows are given
        # Generated per run into a 0600 file rather than committed as a literal,
        # which is what the harness asks for: a flow carrying a literal password
        # could not be committed at all.
        run: |
          set -euo pipefail
          umask 077
          node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))' > "$RUNNER_TEMP/relay-password"
          echo "relay password: $(wc -c < "$RUNNER_TEMP/relay-password") bytes, mode $(stat -c '%a' "$RUNNER_TEMP/relay-password")"

      - name: Start the mock relay for the flows
        run: |
          set -euo pipefail
          pnpm mock:relay \
            --scenario "${{ env.MOCK_RELAY_SCENARIO }}" \
            --password "$(cat "$RUNNER_TEMP/relay-password")" \
            --print-port --quiet \
            < /dev/null > "$RUNNER_TEMP/relay.port" 2> "$RUNNER_TEMP/relay.err" &
          echo $! > "$RUNNER_TEMP/relay.pid"
          for _ in $(seq 1 60); do
            port=$(head -1 "$RUNNER_TEMP/relay.port" 2>/dev/null || true)
            case "$port" in ''|*[!0-9]*) sleep 0.5 ;; *) break ;; esac
          done
          port=$(head -1 "$RUNNER_TEMP/relay.port")
          case "$port" in ''|*[!0-9]*) echo "::error::the mock relay never printed a port"; cat "$RUNNER_TEMP/relay.err"; exit 1 ;; esac
          echo "MOCK_RELAY_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          # The emulator reaches the host's loopback through 10.0.2.2, which is why
          # the flows are given the URL rather than reaching for localhost.
          echo "RELAY_URL_FOR_DEVICE=http://10.0.2.2:$port" >> "$GITHUB_ENV"
          echo "mock relay: http://127.0.0.1:$port (pid $(cat "$RUNNER_TEMP/relay.pid"))"

      - name: Run the flows
        id: flows
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ env.MAESTRO_API_LEVEL }}
          target: google_apis
          arch: x86_64
          avd-name: lo-mobile-e2e
          force-avd-creation: false
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -no-snapshot-save
          disable-animations: true
          # A spell checker underlining as you type is a known source of text-input
          # flakiness.
          disable-spellchecker: true
          # NB: the action parses `script:` into ONE COMMAND PER LINE and runs each
          # line as its own `/usr/bin/sh -c` (dash, not bash) — keep every command on
          # a single line, POSIX-only, no `\` continuations. `#` comment lines are
          # dropped by the action's parser. A `set -o pipefail` here killed every run
          # at line 1 (`set: Illegal option -o pipefail`, exit 2) before adb install
          # or maestro ever ran.
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            # `SESSION_ID` is the harness's own fixture session id, from the corpus
            # the mock relay serves (`fixtures/relay/**` — the id every captured
            # projection uses).
            # The `test` subcommand requires the flow target positional: pass the
            # workspace root (`e2e/maestro`) — its `flows:` list selects which flows
            # run, and the config's globs resolve against the directory passed.
            # Per-step screenshots and per-flow logs land under `--test-output-dir`
            # — v2.11.0 writes its run artifacts (manifest, logs, takeScreenshot/)
            # into that directory — and that directory is what the upload step
            # takes. `-e` values reach the flows' own environment; they cannot
            # route the CLI's outputs.
            # One retry, and only one (ADR 0003): Maestro 2.11.0's CLI has no retry
            # flag, so the invocation itself re-runs the set once on failure and
            # raises a ::warning — a flake stays visible, a second failure is a
            # failure (the step's exit code).
            run_flows() { maestro test --config e2e/maestro/config.yaml -e APP_ID="$APP_ID" -e RELAY_URL="$RELAY_URL_FOR_DEVICE" -e RELAY_PASSWORD="$(cat "$RUNNER_TEMP/relay-password")" -e SESSION_ID=6714def86197 --test-output-dir "$RUNNER_TEMP/maestro-screenshots" e2e/maestro; }; run_flows || { echo "::warning title=Maestro flaked once::the flow set failed; re-running it once, per ADR 0003 — a second failure is a failure"; run_flows; }

      - name: Stop the mock relay
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/relay.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/relay.pid")
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
            kill -9 "$pid" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/relay-password"

      - name: Upload the per-step screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-screenshots
          path: ${{ runner.temp }}/maestro-screenshots
          retention-days: 30
