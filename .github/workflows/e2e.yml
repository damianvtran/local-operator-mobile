name: E2E (mock relay, audit and Maestro)

# The end-to-end and design-audit layers, wired to the harness that owns them.
#
# EVERY COMMAND BELOW IS TAKEN FROM `docs/e2e/ci-notes.md` (the harness's own
# note to the job that owns `.github/**`) AND ITS TOOLS' USAGE BLOCKS, not from a
# guess: `tools/mock-relay/verify.mjs`, `tools/visual/capture.mjs`,
# `tools/audit/audit.mjs`, `e2e/run-canary.mjs`, `e2e/maestro/config.yaml`. The
# harness is plain Node with no dependencies, so most of this job needs a
# checkout and nothing else.
#
# IT CANNOT BLOCK A PULL REQUEST IT CANNOT RUN. The harness arrives in its own
# change, and until it is on the ref under test the jobs are SKIPPED — which
# GitHub renders as `skipped`, never as a green tick, so an absent suite cannot
# be read as a passing one. A `harness` job does the detection and says in its
# summary exactly which piece is missing.
#
# ONE RETRY, AND ONLY FOR THE FLOWS (ADR 0004). Maestro gets `--retry`, which the
# harness's own config asks CI to pass, and the retry is reported separately so a
# flake is visible as a flake. Nothing else in the repository retries.
#
# WHAT IS DELIBERATELY NOT HERE, rather than quietly missing:
#   * the **re-capture diff** (ADR 0003, §6 of the harness notes). It needs an
#     isolated `lop mobile` and therefore the Python toolchain, and the script
#     ADR 0003 requires does not exist yet — there is nothing to wire.
#   * **Maestro on an iOS simulator.** The harness documents the invocation, and
#     the flows are platform-parameterised, but the emulator job is the most
#     expensive thing this repository runs and it should be green for a while
#     before a second copy of it exists on macOS minutes. It is a follow-up, not
#     a silent gap: docs/ci.md says so too.

on:
  workflow_dispatch:
  schedule:
    # Nightly, off-peak: the emulator job is the slowest thing here and the least
    # useful on a branch nobody is waiting for.
    - cron: "17 3 * * *"
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  # Pinned explicitly. The Maestro installer accepts a version and otherwise
  # installs "latest", and a mobile-e2e job whose driver changes silently between
  # two runs is a job whose failures cannot be attributed to anything.
  MAESTRO_VERSION: "2.11.0"
  # Android 16, which is what Google requires of new apps and updates since
  # 2026-08-31 (ADR 0004).
  MAESTRO_API_LEVEL: "36"
  # The scenario the mock relay is started with, named in ONE place so the
  # capture, the audit and the flows all describe the same state — the harness
  # notes are explicit that running them against different states makes the
  # numbers mean nothing. `idle` is the relay's own default.
  MOCK_RELAY_SCENARIO: idle

jobs:
  harness:
    name: Is the audit harness present?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relay: ${{ steps.detect.outputs.relay }}
      audit: ${{ steps.detect.outputs.audit }}
      canary: ${{ steps.detect.outputs.canary }}
      maestro: ${{ steps.detect.outputs.maestro }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect the harness
        id: detect
        run: |
          set -euo pipefail
          check() { [ -f "$1" ] && echo true || echo false; }
          relay=$(check tools/mock-relay/verify.mjs)
          audit=$(check tools/audit/audit.mjs)
          canary=$(check e2e/run-canary.mjs)
          [ -f tools/visual/capture.mjs ] || audit=false
          maestro=false
          if [ -d e2e/maestro ]; then
            maestro=$(find e2e/maestro -name '*.yaml' -print -quit | grep -q . && echo true || echo false)
          fi
          for pair in relay=$relay audit=$audit canary=$canary maestro=$maestro; do
            echo "$pair" >> "$GITHUB_OUTPUT"
          done
          {
            echo "## End-to-end harness"
            echo
            echo "| piece | present |"
            echo "|---|---|"
            echo "| mock relay contract test (\`tools/mock-relay/verify.mjs\`) | $relay |"
            echo "| capture + audit (\`tools/visual/capture.mjs\`, \`tools/audit/audit.mjs\`) | $audit |"
            echo "| instrument canary (\`e2e/run-canary.mjs\`) | $canary |"
            echo "| Maestro flows (\`e2e/maestro/**/*.yaml\`) | $maestro |"
            echo
            if [ "$relay" = false ] || [ "$audit" = false ] || [ "$canary" = false ] || [ "$maestro" = false ]; then
              echo "A missing piece is reported as \`skipped\`, which is honest; a green"
              echo "tick on a suite that did not run would not be. The harness is"
              echo "developed in its own change (ADR 0003); \`docs/e2e/ci-notes.md\` is"
              echo "the contract this workflow consumes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "relay=$relay audit=$audit canary=$canary maestro=$maestro"

  mock-relay-contract:
    name: Mock relay contract (229 assertions, seconds)
    needs: harness
    if: needs.harness.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No pnpm, no install, no Chrome: this tool drives the relay it lives beside
      # and asserts the wire contract against the captured fixture corpus. It is
      # the mock's own proof, which is what keeps the mock from drifting away
      # from the relay it re-implements.
      - name: Assert the mock relay's contract
        run: node tools/mock-relay/verify.mjs

  web-audit:
    name: Web target — frames, audit and the canary
    needs: harness
    if: needs.harness.outputs.audit == 'true'
    runs-on: ubuntu-latest
    # The capture matrix is minutes; the bound is the diagnosis, not the budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export the web target
        # The harness drives the EXPORT, not a dev server: the export is what a
        # reviewer's bundle would be, and a dev server's on-the-fly transform is a
        # second variable in a job whose whole point is reproducibility.
        run: pnpm export:web

      - name: Start the mock relay on an ephemeral port
        # One relay per job, on a port the OS picks (never the operator's own
        # 4098), printing the port alone on stdout. Diagnostics go to a file: a
        # background process holding the step's stdout open is how a CI job hangs.
        run: |
          set -euo pipefail
          node tools/mock-relay/relay.mjs \
            --scenario "${{ env.MOCK_RELAY_SCENARIO }}" \
            --print-port --quiet \
            < /dev/null > "$RUNNER_TEMP/relay.port" 2> "$RUNNER_TEMP/relay.err" &
          echo $! > "$RUNNER_TEMP/relay.pid"
          for _ in $(seq 1 60); do
            port=$(head -1 "$RUNNER_TEMP/relay.port" 2>/dev/null || true)
            case "$port" in ''|*[!0-9]*) sleep 0.5 ;; *) break ;; esac
          done
          port=$(head -1 "$RUNNER_TEMP/relay.port")
          case "$port" in ''|*[!0-9]*) echo "::error::the mock relay never printed a port"; cat "$RUNNER_TEMP/relay.err"; exit 1 ;; esac
          echo "MOCK_RELAY_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "mock relay: http://127.0.0.1:$port (pid $(cat "$RUNNER_TEMP/relay.pid"))"

      - name: Capture the frames
        # `--relay` is what supplies the scenario list and session ids, so the
        # capture and the audit describe the SAME state (the harness notes are
        # explicit about that coupling). Frames are written outside the
        # repository and uploaded — never committed (ADR 0003).
        run: |
          node tools/visual/capture.mjs \
            --dir dist --out "$RUNNER_TEMP/frames" \
            --relay "$MOCK_RELAY_URL" \
            --consecutive --yes

      - name: Audit the frames against the rubric
        # Exits non-zero on any FAIL row. BLOCKED rows are reported and counted
        # rather than failing the job — an app whose type ignores the root
        # font-size is a finding for the review thread, not a broken harness.
        run: |
          node tools/audit/audit.mjs \
            --manifest "$RUNNER_TEMP/frames/manifest.json" \
            --out "$RUNNER_TEMP/audit"

      - name: Run the canary
        if: needs.harness.outputs.canary == 'true'
        # The gate that stops the audit rotting into a rubber stamp: the fixture
        # page declares its own defects, so this fails if the audit stops catching
        # them, starts failing the clean page, or if the harness's own scale
        # dimension goes inert.
        run: node e2e/run-canary.mjs

      - name: Stop the mock relay
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/relay.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/relay.pid")
            # By exact pid, and only the one this job started.
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
            kill -9 "$pid" 2>/dev/null || true
          fi
          echo "relay stopped; any remaining listener on the port was never this job's"

      - name: Upload the frames, the manifest and the audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-frames
          path: |
            ${{ runner.temp }}/frames
            ${{ runner.temp }}/audit
          retention-days: 30

  maestro-android:
    name: Maestro flows on an Android 16 emulator
    needs: harness
    # NIGHTLY AND ON DEMAND, not per push: the harness's own note says "nightly and
    # release gate", and ADR 0003's risk table limits emulator flows for the same
    # reason — they are the slowest, flakiest part of the pipeline and the least
    # informative on a branch somebody is iterating on.
    if: needs.harness.outputs.maestro == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the debug APK to install on the emulator
        # Built here rather than downloaded from the Android workflow: a
        # cross-workflow artefact download couples two independent triggers, and
        # the debug APK is exactly what the flows should run against.
        run: |
          set -euo pipefail
          pnpm exec expo prebuild --platform android --clean --no-install
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Restore the Android AVD
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: ${{ runner.os }}-avd-${{ env.MAESTRO_API_LEVEL }}-${{ hashFiles('e2e/maestro/**') }}

      - name: Install the pinned Maestro CLI
        # The one `curl | bash` this repository allows (ADR 0004), and
        # MAESTRO_VERSION is what keeps it from being "latest".
        run: |
          set -euo pipefail
          export MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Write the relay password the flows are given
        # Generated per run into a 0600 file rather than committed as a literal,
        # which is what the harness asks for: a flow carrying a literal password
        # could not be committed at all.
        run: |
          set -euo pipefail
          umask 077
          node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))' > "$RUNNER_TEMP/relay-password"
          echo "relay password: $(wc -c < "$RUNNER_TEMP/relay-password") bytes, mode $(stat -c '%a' "$RUNNER_TEMP/relay-password")"

      - name: Start the mock relay for the flows
        run: |
          set -euo pipefail
          node tools/mock-relay/relay.mjs \
            --scenario "${{ env.MOCK_RELAY_SCENARIO }}" \
            --password "$(cat "$RUNNER_TEMP/relay-password")" \
            --print-port --quiet \
            < /dev/null > "$RUNNER_TEMP/relay.port" 2> "$RUNNER_TEMP/relay.err" &
          echo $! > "$RUNNER_TEMP/relay.pid"
          for _ in $(seq 1 60); do
            port=$(head -1 "$RUNNER_TEMP/relay.port" 2>/dev/null || true)
            case "$port" in ''|*[!0-9]*) sleep 0.5 ;; *) break ;; esac
          done
          port=$(head -1 "$RUNNER_TEMP/relay.port")
          case "$port" in ''|*[!0-9]*) echo "::error::the mock relay never printed a port"; cat "$RUNNER_TEMP/relay.err"; exit 1 ;; esac
          echo "MOCK_RELAY_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          # The emulator reaches the host's loopback through 10.0.2.2, which is why
          # the flows are given the URL rather than reaching for localhost.
          echo "RELAY_URL_FOR_DEVICE=http://10.0.2.2:$port" >> "$GITHUB_ENV"
          echo "mock relay: http://127.0.0.1:$port (pid $(cat "$RUNNER_TEMP/relay.pid"))"

      - name: Run the flows
        id: flows
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ env.MAESTRO_API_LEVEL }}
          target: google_apis
          arch: x86_64
          avd-name: lo-mobile-e2e
          force-avd-creation: false
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -no-snapshot-save
          disable-animations: true
          # A spell checker underlining as you type is a known source of text-input
          # flakiness.
          disable-spellchecker: true
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            maestro --config e2e/maestro/config.yaml test --retry 1 \
              -e APP_ID=com.radient.localoperator.mobile \
              -e RELAY_URL="$RELAY_URL_FOR_DEVICE" \
              -e RELAY_PASSWORD="$(cat "$RUNNER_TEMP/relay-password")" \
              -e SESSION_ID=6714def86197 \
              -e MAESTRO_SCREENSHOTS="$RUNNER_TEMP/maestro-screenshots"

      - name: Stop the mock relay
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/relay.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/relay.pid")
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
            kill -9 "$pid" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/relay-password"

      - name: Upload the per-step screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-screenshots
          path: ${{ runner.temp }}/maestro-screenshots
          retention-days: 30
