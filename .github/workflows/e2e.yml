name: E2E (mock relay, audit and Maestro)

# The end-to-end and design-audit layers, wired to the harness that owns them.
#
# EVERY COMMAND BELOW IS TAKEN FROM `docs/e2e/ci-notes.md` (the harness's own
# note to the job that owns `.github/**`) AND ITS TOOLS' USAGE BLOCKS, not from a
# guess: `tools/mock-relay/verify.mjs`, `tools/visual/capture.mjs`,
# `tools/audit/audit.mjs`, `e2e/run-canary.mjs`, `e2e/maestro/config.yaml`. The
# harness is plain Node with no dependencies, so most of this job needs a
# checkout and nothing else.
#
# IT CANNOT BLOCK A PULL REQUEST IT CANNOT RUN. The harness arrives in its own
# change, and until it is on the ref under test the jobs are SKIPPED — which
# GitHub renders as `skipped`, never as a green tick, so an absent suite cannot
# be read as a passing one. A `harness` job does the detection and says in its
# summary exactly which piece is missing.
#
# ONE RETRY, AND ONLY FOR THE FLOWS (ADR 0004). Maestro gets `--retry`, which the
# harness's own config asks CI to pass, and the retry is reported separately so a
# flake is visible as a flake. Nothing else in the repository retries.
#
# WHAT IS DELIBERATELY NOT HERE, rather than quietly missing:
#   * the **re-capture diff** (ADR 0003, §6 of the harness notes). It needs an
#     isolated `lop mobile` and therefore the Python toolchain, and the script
#     ADR 0003 requires does not exist yet — there is nothing to wire.
#   * **Maestro on an iOS simulator.** The harness documents the invocation, and
#     the flows are platform-parameterised, but the emulator job is the most
#     expensive thing this repository runs and it should be green for a while
#     before a second copy of it exists on macOS minutes. It is a follow-up, not
#     a silent gap: docs/ci.md says so too.

on:
  workflow_dispatch:
  schedule:
    # Nightly, off-peak: the emulator job is the slowest thing here and the least
    # useful on a branch nobody is waiting for.
    - cron: "17 3 * * *"
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  # Pinned explicitly. The Maestro installer accepts a version and otherwise
  # installs "latest", and a mobile-e2e job whose driver changes silently between
  # two runs is a job whose failures cannot be attributed to anything.
  MAESTRO_VERSION: "2.11.0"
  # Android 16, which is what Google requires of new apps and updates since
  # 2026-08-31 (ADR 0004).
  MAESTRO_API_LEVEL: "36"
  # The scenario the mock relay is started with, named in ONE place so the
  # capture, the audit and the flows all describe the same state — the harness
  # notes are explicit that running them against different states makes the
  # numbers mean nothing. `idle` is the relay's own default.
  MOCK_RELAY_SCENARIO: idle

jobs:
  harness:
    name: Is the audit harness present? (fails if it is not)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Detect the harness
        # A GREEN RUN OF THIS WORKFLOW MUST MEAN THE SUITES RAN. Until this step
        # could fail, a tree without `tools/` produced `success` with every suite
        # `skipped` — a green tick on a suite that did not run, which is the
        # defect class this project treats as a defect (review M1). The harness is
        # what this workflow exists to run (ADR 0003, `docs/e2e/ci-notes.md`), so
        # its absence is a failure of the workflow's own premise, and the
        # annotation names exactly which pieces are missing.
        id: detect
        run: |
          set -euo pipefail
          missing=()
          for path in \
            tools/mock-relay/verify.mjs \
            tools/visual/capture.mjs \
            tools/audit/audit.mjs \
            e2e/run-canary.mjs; do
            [ -f "$path" ] || missing+=("$path")
          done
          if ! find e2e/maestro -name '*.yaml' -print -quit 2>/dev/null | grep -q .; then
            missing+=("e2e/maestro/**/*.yaml")
          fi
          {
            echo "## End-to-end harness"
            echo
            if [ ${#missing[@]} -eq 0 ]; then
              echo "Every piece of the harness is present; the suites below ran."
            else
              echo "**The harness is not in this tree.** Missing:"
              echo
              for path in "${missing[@]}"; do echo "- \`$path\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the audit harness is not in this tree: ${missing[*]}. This workflow exists to run it (ADR 0003, docs/e2e/ci-notes.md) and it ships in its own change, so this is a real failure of the pipeline rather than a reason to skip: a green conclusion here would claim the mock relay, the frame audit and the canary had run when none of them had."
            exit 1
          fi
          echo "the harness is present in full"

  mock-relay-contract:
    name: Mock relay contract (229 assertions, seconds)
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No pnpm, no install, no Chrome: this tool drives the relay it lives beside
      # and asserts the wire contract against the captured fixture corpus. It is
      # the mock's own proof, which is what keeps the mock from drifting away
      # from the relay it re-implements.
      - name: Assert the mock relay's contract
        run: node tools/mock-relay/verify.mjs

  web-audit:
    name: Web target — frames, audit and the canary
    needs: harness
    # macOS BECAUSE THE HARNESS' CHROME DISCOVERY IS macOS-ONLY TODAY, and that is
    # a finding rather than a preference: `tools/lib/chrome.mjs` looks for
    # `/Applications/Google Chrome.app/Contents/MacOS/Google Chrome` and fails
    # with "Google Chrome is not installed at …" on a Linux runner, where the same
    # binary is `google-chrome` on PATH. Measured in CI on 2026-09-30. The frames
    # and the audit are worth running now rather than after that module grows its
    # Linux candidates, so this job runs where the harness can find a browser; it
    # moves back to ubuntu (cheaper and closer to a contributor's machine) the
    # moment chrome.mjs looks at PATH, and the design kit's own capture script —
    # which does look at PATH — is the precedent for the fix.
    runs-on: macos-26
    # The capture matrix is minutes; the bound is the diagnosis, not the budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export the web target
        # The harness drives the EXPORT, not a dev server: the export is what a
        # reviewer's bundle would be, and a dev server's on-the-fly transform is a
        # second variable in a job whose whole point is reproducibility.
        run: pnpm export:web

      - name: Start the mock relay on an ephemeral port
        # One relay per job, on a port the OS picks (never the operator's own
        # 4098), printing the port alone on stdout. Diagnostics go to a file: a
        # background process holding the step's stdout open is how a CI job hangs.
        run: |
          set -euo pipefail
          node tools/mock-relay/relay.mjs \
            --scenario "${{ env.MOCK_RELAY_SCENARIO }}" \
            --print-port --quiet \
            < /dev/null > "$RUNNER_TEMP/relay.port" 2> "$RUNNER_TEMP/relay.err" &
          echo $! > "$RUNNER_TEMP/relay.pid"
          for _ in $(seq 1 60); do
            port=$(head -1 "$RUNNER_TEMP/relay.port" 2>/dev/null || true)
            case "$port" in ''|*[!0-9]*) sleep 0.5 ;; *) break ;; esac
          done
          port=$(head -1 "$RUNNER_TEMP/relay.port")
          case "$port" in ''|*[!0-9]*) echo "::error::the mock relay never printed a port"; cat "$RUNNER_TEMP/relay.err"; exit 1 ;; esac
          echo "MOCK_RELAY_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "mock relay: http://127.0.0.1:$port (pid $(cat "$RUNNER_TEMP/relay.pid"))"

      - name: Capture the frames
        # BOUNDED PER STEP, not just per job. A capture that hangs would otherwise
        # consume the whole job budget and report nothing: measured on
        # 2026-09-30, this step ran over 90 minutes inside a 45-minute job
        # timeout (run 36669731994) without GitHub reaping it, so the run said
        # only that it was still going. Twenty minutes is several times a
        # complete matrix on a warm runner, and a fired bound names this step.
        timeout-minutes: 20
        # CELLS COME FROM THE RELAY, THROUGH ITS OWN REGISTRY, and the detour is a
        # finding rather than a preference. `capture.mjs --relay <url>` asks the
        # relay at `/__mock/state` for `state.cells`, but the relay serves no
        # such field — its registry is at `/__mock/scenarios` as
        # `scenarios[].shows` (relay.mjs, the two `__mock` handlers; capture.mjs
        # `relayState()` and `buildPlan()`). So the documented invocation fails
        # with "no cells to capture", measured in CI on 2026-09-30, and the
        # harness's own fallback — `--cells` — is what makes the run possible.
        # Reading `shows` from the relay keeps the property the harness cares
        # about (one source of truth for which cells exist, nothing
        # hand-maintained here) while that mismatch stands. When it is fixed,
        # dropping the `--cells` argument restores the shorter path.
        #
        # Frames are written outside the repository and uploaded — never
        # committed (ADR 0003).
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          # The single-quoted script below is JavaScript for node, so its `${cell}`
          # template literals must NOT be expanded by the shell; shellcheck cannot
          # know that from the quoting alone.
          curl -fsS "$MOCK_RELAY_URL/__mock/scenarios" | node --input-type=module -e '
            import { resolve } from "node:path";
            import { pathToFileURL } from "node:url";

            let raw = "";
            process.stdin.on("data", (chunk) => {
              raw += chunk;
            });
            process.stdin.on("end", async () => {
              const { SCREENS } = await import(
                pathToFileURL(resolve("tools/visual/matrix.mjs")).href
              );
              const known = new Set(Object.keys(SCREENS));
              const payload = JSON.parse(raw);
              const cells = new Set();
              const dropped = new Set();
              for (const scenario of payload.scenarios ?? []) {
                for (const cell of scenario.shows ?? []) {
                  const text = String(cell);
                  const screen = text.slice(0, text.lastIndexOf("/"));
                  // `path:<route>` cells point at an ad-hoc page rather than an
                  // app screen, which is how the canary is driven.
                  if (screen.startsWith("path:") || known.has(screen)) cells.add(text);
                  else dropped.add(text);
                }
              }
              if (cells.size === 0) {
                console.error("the relay and the capture matrix share no cells");
                process.exit(1);
              }
              for (const cell of [...dropped].sort()) console.error(`no screen for cell: ${cell}`);
              process.stdout.write([...cells].sort().join(","));
            });
          ' > "$RUNNER_TEMP/cells.txt" 2> "$RUNNER_TEMP/cells.err"
          cells=$(cat "$RUNNER_TEMP/cells.txt")
          count=$(printf "%s" "$cells" | tr ',' '\n' | wc -l | tr -d ' ')
          dropped=$(wc -l < "$RUNNER_TEMP/cells.err" | tr -d ' ')
          echo "cells ($count): $cells"
          if [ "$dropped" != "0" ]; then
            # Reported, not hidden: the relay's scenario registry and the capture
            # matrix disagree about which screens exist, and the cells that fall
            # in the gap are named so the two owners can settle it.
            cat "$RUNNER_TEMP/cells.err"
            echo "::warning::$dropped cell(s) the relay declares were skipped: no screen is defined for them in tools/visual/matrix.mjs, so the capture harness cannot render them. Nothing is silently dropped — this line is the list."
            {
              echo "## Cells the harness could not render"
              echo
              echo '```'
              cat "$RUNNER_TEMP/cells.err"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          node tools/visual/capture.mjs \
            --dir dist --out "$RUNNER_TEMP/frames" \
            --relay "$MOCK_RELAY_URL" \
            --cells "$cells" \
            --consecutive --yes

      - name: Audit the frames against the rubric
        timeout-minutes: 5
        # Exits non-zero on any FAIL row. BLOCKED rows are reported and counted
        # rather than failing the job — an app whose type ignores the root
        # font-size is a finding for the review thread, not a broken harness.
        run: |
          node tools/audit/audit.mjs \
            --manifest "$RUNNER_TEMP/frames/manifest.json" \
            --out "$RUNNER_TEMP/audit"

      - name: Run the canary
        timeout-minutes: 5
        # The gate that stops the audit rotting into a rubber stamp: the fixture
        # page declares its own defects, so this fails if the audit stops catching
        # them, starts failing the clean page, or if the harness's own scale
        # dimension goes inert.
        run: node e2e/run-canary.mjs

      - name: Stop the mock relay
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/relay.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/relay.pid")
            # By exact pid, and only the one this job started.
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
            kill -9 "$pid" 2>/dev/null || true
          fi
          echo "relay stopped; any remaining listener on the port was never this job's"

      - name: Upload the frames, the manifest and the audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-frames
          path: |
            ${{ runner.temp }}/frames
            ${{ runner.temp }}/audit
          retention-days: 30

  maestro-android:
    name: Maestro flows on an Android 16 emulator
    needs: harness
    # NIGHTLY AND ON DEMAND, not per push: the harness's own note says "nightly and
    # release gate", and ADR 0003's risk table limits emulator flows for the same
    # reason — they are the slowest, flakiest part of the pipeline and the least
    # informative on a branch somebody is iterating on.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the debug APK to install on the emulator
        # Built here rather than downloaded from the Android workflow: a
        # cross-workflow artefact download couples two independent triggers, and
        # the debug APK is exactly what the flows should run against.
        run: |
          set -euo pipefail
          pnpm exec expo prebuild --platform android --clean --no-install
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Read the app's identity from the APK it just built
        # The flows are told the APP_ID they should launch, and until this step
        # existed that value was the harness's own default
        # (`com.radient.localoperator.mobile`) while the app the build produces is
        # `com.localoperator.mobile` (app.config.ts). Two bundle ids in one
        # repository is a bug whichever one is right — and the right one for the
        # pipeline is whatever the build actually produced, because that is the
        # app installed on the emulator. Reading it out of the APK removes the
        # second copy entirely, and the bundle id itself stays an operator
        # decision rather than something CI invents.
        run: |
          set -euo pipefail
          aapt=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name aapt2 -type f | sort | tail -1)
          echo "aapt2: $aapt"
          package=$("$aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk \
            | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)
          if [ -z "$package" ]; then
            echo "::error::could not read the package name out of the debug APK"
            exit 1
          fi
          echo "APP_ID=$package" >> "$GITHUB_ENV"
          echo "app under test: $package"

      - name: Restore the Android AVD
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: ${{ runner.os }}-avd-${{ env.MAESTRO_API_LEVEL }}-${{ hashFiles('e2e/maestro/**') }}

      - name: Install the pinned Maestro CLI
        # The one `curl | bash` this repository allows (ADR 0004), and
        # MAESTRO_VERSION is what keeps it from being "latest".
        run: |
          set -euo pipefail
          export MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Write the relay password the flows are given
        # Generated per run into a 0600 file rather than committed as a literal,
        # which is what the harness asks for: a flow carrying a literal password
        # could not be committed at all.
        run: |
          set -euo pipefail
          umask 077
          node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))' > "$RUNNER_TEMP/relay-password"
          echo "relay password: $(wc -c < "$RUNNER_TEMP/relay-password") bytes, mode $(stat -c '%a' "$RUNNER_TEMP/relay-password")"

      - name: Start the mock relay for the flows
        run: |
          set -euo pipefail
          node tools/mock-relay/relay.mjs \
            --scenario "${{ env.MOCK_RELAY_SCENARIO }}" \
            --password "$(cat "$RUNNER_TEMP/relay-password")" \
            --print-port --quiet \
            < /dev/null > "$RUNNER_TEMP/relay.port" 2> "$RUNNER_TEMP/relay.err" &
          echo $! > "$RUNNER_TEMP/relay.pid"
          for _ in $(seq 1 60); do
            port=$(head -1 "$RUNNER_TEMP/relay.port" 2>/dev/null || true)
            case "$port" in ''|*[!0-9]*) sleep 0.5 ;; *) break ;; esac
          done
          port=$(head -1 "$RUNNER_TEMP/relay.port")
          case "$port" in ''|*[!0-9]*) echo "::error::the mock relay never printed a port"; cat "$RUNNER_TEMP/relay.err"; exit 1 ;; esac
          echo "MOCK_RELAY_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          # The emulator reaches the host's loopback through 10.0.2.2, which is why
          # the flows are given the URL rather than reaching for localhost.
          echo "RELAY_URL_FOR_DEVICE=http://10.0.2.2:$port" >> "$GITHUB_ENV"
          echo "mock relay: http://127.0.0.1:$port (pid $(cat "$RUNNER_TEMP/relay.pid"))"

      - name: Run the flows
        id: flows
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ env.MAESTRO_API_LEVEL }}
          target: google_apis
          arch: x86_64
          avd-name: lo-mobile-e2e
          force-avd-creation: false
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -no-snapshot-save
          disable-animations: true
          # A spell checker underlining as you type is a known source of text-input
          # flakiness.
          disable-spellchecker: true
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            maestro --config e2e/maestro/config.yaml test --retry 1 \
              -e APP_ID="$APP_ID" \
              -e RELAY_URL="$RELAY_URL_FOR_DEVICE" \
              -e RELAY_PASSWORD="$(cat "$RUNNER_TEMP/relay-password")" \
              # The harness's own fixture session id, from the corpus the mock
              # relay serves (`fixtures/relay/**` — the id every captured
              # projection uses). Named here because a bare constant in a file
              # that names the source of every other constant is the one that
              # gets copied somewhere it does not belong.
              -e SESSION_ID=6714def86197 \
              -e MAESTRO_SCREENSHOTS="$RUNNER_TEMP/maestro-screenshots"

      - name: Stop the mock relay
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/relay.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/relay.pid")
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
            kill -9 "$pid" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/relay-password"

      - name: Upload the per-step screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-screenshots
          path: ${{ runner.temp }}/maestro-screenshots
          retention-days: 30
