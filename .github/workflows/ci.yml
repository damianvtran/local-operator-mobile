name: CI

# The gate every pull request pays for, and the same gate on `main`.
#
# WHAT THIS WORKFLOW IS FOR. The primary development machine has no Xcode and no
# Android SDK, and the native jobs live in android.yml and ios.yml — but the
# *logic* of this app is JavaScript, and the fastest honest signal on a change is
# still lint + types + unit tests + the web export. Those four run here, on
# Linux, in minutes. A change that cannot typecheck or whose tests fail should
# never be the reason a macOS runner was queued.
#
# ACTIONS ARE PINNED TWO WAYS, DELIBERATELY (ADR 0004, "Supply-chain hygiene"):
#   * `actions/*`, `pnpm/action-setup` and `actions/setup-java` track a major tag
#     (`checkout@v7`), because GitHub maintains them and a major tag is the
#     conventional way to consume them;
#   * every third-party action is pinned to a FULL COMMIT SHA with the release it
#     corresponds to in a comment, because a compromised third-party action
#     running in a release job holds the signing key. The SHA is the only pin a
#     tag cannot be moved out from under.
# `version` is omitted from pnpm/action-setup on purpose: the action reads
# `packageManager` from package.json, so the pnpm version has exactly one home.
#
# NO PATH FILTER IN `on.paths`. A workflow excluded by a path filter does not
# "skip" — it never runs, and a required check that never runs stays pending
# forever, which is unreachable-for-merge. Expensive jobs are gated by an `if:`
# on a `changes` job instead (android.yml, ios.yml and now this file's
# `design-kit`, which pays for a macOS runner): the workflow always runs, so a
# required check always reports, and the skip is visible as a skipped job.

on:
  push:
    branches:
      # `main` only. A feature branch with an open pull request would otherwise
      # fire a `push` run and a `pull_request` run for one identical result.
      - main
  pull_request:
  workflow_dispatch:
  # Callable, so release.yml can run the SAME gate a pull request runs rather
  # than a second copy of it. "What shipped == what CI ran" is a property worth
  # having structurally instead of by diligence.
  workflow_call:
  # A weekly sweep, because the design gates compare RE-RENDERED artefacts and a
  # rasterizer or font on a runner image can change without this repository
  # changing. Without it, the first evidence of that drift would be a PR that
  # touches nothing design-related and still fails.
  schedule:
    - cron: "0 6 * * 1"

# One in-flight run per ref. A review cycle pushes repeatedly, and without this
# every superseded push kept its job set queued.
#
# A SUPERSEDED `main` PUSH IS CANCELLED TOO (2026-11-18). This file's push run
# uploads nothing outside GitHub (`release-staging` is a fake round trip through
# workflow artefacts; the store uploads live in release.yml and the native
# workflows), and the next merge's run checks a strict superset of the tree, so
# the older verdict is moot. The operator's account shares ONE concurrent-job pool
# across every repository: at 04:50Z on 2026-11-18 ~10 of ~17 running jobs were
# this repository's CI/E2E while local-operator's release gate sat queued 80+
# minutes, and a stack of main-push runs (this file's `design-kit` takes a macOS
# runner on every push) is exactly that pressure. Scoped to `push` on
# `refs/heads/main`, so the weekly sweep, a manual dispatch and a release's
# `workflow_call` (a tag ref or a dispatch event, never `push` on main) are
# never cancelled.
#
# LITERAL WORKFLOW PREFIX (`ci-...`) AND `github.event_name` ARE PART OF THE
# GROUP. When release.yml calls this workflow via `workflow_call`,
# `github.workflow` inside the callee is the CALLER's name, so a group of
# `workflow-ref` alone is identical to release.yml's own group — GitHub's
# documented outcome is "Canceling since a deadlock for concurrency group … was
# detected between 'top level workflow' and …", i.e. the release's `gate` job is
# cancelled before it starts. Using the literal `'ci'` prefix plus
# `github.event_name` keeps caller and callee lanes distinct even when called
# from a `pull_request` or tag workflow.
# `cancel-in-progress` never reaches a tag for the same reason: a tag run is a
# release in progress, and cancelling it would drop the artefacts.
concurrency:
  group: ${{ format('ci-{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

# Least privilege: nothing here writes. The release workflow is the one place
# that elevates, and only for the job that creates a Release.
permissions:
  contents: read

env:
  # Expo's floor is Node 22.13+ / 24.3+; 24 is what the repository is developed
  # on, so CI runs the version the app is written against.
  # Node >= 24, and it is not a preference: every tool in this repository is
  # TypeScript executed directly, which needs native type stripping (unflagged
  # from Node 23.6). On anything older the gates do not run at all.
  NODE_VERSION: "24"

jobs:
  changes:
    name: Does this change touch the design gates' inputs?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      design: ${{ steps.diff.outputs.design }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the base commit, not just the head.
          fetch-depth: 0

      - name: Decide whether the macOS design job is worth running
        # The design gates re-render committed artefacts and compare them, which
        # needs macOS (the committed PNGs were generated there), `librsvg`,
        # ImageMagick and a `brew install` — the most expensive thing in this
        # workflow. Path-gating it is the same trade android.yml and ios.yml
        # already make (review M4); it still runs on every `main` push, on a
        # weekly schedule, and inside a release gate, so drift cannot hide.
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Not a pull request: `main` is the record, a hand-run is somebody
          # asking for this pipeline on purpose, a release gate must cover the
          # whole gate, and the schedule is the sweep. All of those run it.
          if [ "$EVENT" != "pull_request" ]; then
            echo "design=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No `--depth`: the three-dot diff needs a merge base, and the checkout
          # above already holds full history. A `--depth=1` fetch of a base that
          # has moved past the PR merge ref's parent grafts the new tip in with
          # no parents, makes the clone shallow, and `git diff` then dies with
          # `fatal: FETCH_HEAD...HEAD: no merge base` (exit 128) — PR #126.
          git fetch --no-tags origin "$BASE_REF"
          files=$(git diff --name-only "FETCH_HEAD...HEAD")
          if [ -z "$files" ]; then
            # An empty diff is not evidence that nothing design-related changed.
            echo "design=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The inputs these gates read, and the generators that produce the
          # files they compare: the token source, the committed assets and
          # frames, the generated styling layer in `src/ui`, the theme generator,
          # the gate scripts themselves, and the kit pin (`design-kit.lock.json`
          # is a parity-check input at the repository root, so a lock-only change
          # — a pin bump — must run this job). A change confined to anything else
          # cannot alter a re-render.
          design=$(printf '%s\n' "$files" \
            | grep -E '^(design/|docs/design/|src/ui/|scripts/|tailwind\.config\.|package\.json$|pnpm-lock\.yaml$|design-kit\.lock\.json$|\.github/workflows/ci\.yml$)' \
            || true)
          if [ -n "$design" ]; then
            echo "design=true" >> "$GITHUB_OUTPUT"
            printf 'design surfaces touched:\n%s\n' "$(printf '%s\n' "$design" | head -20)"
          else
            echo "design=false" >> "$GITHUB_OUTPUT"
            echo "nothing under design/, docs/design/, src/ui/, scripts/, the kit pin or the configs changed — the macOS design job is skipped"
          fi

  checks:
    name: Checks (lint, format, types, unit tests, web export)
    runs-on: ubuntu-latest
    # Bounded so a wedged step cannot hold a runner for GitHub's 360-minute
    # default. A cold run is 4-7 minutes; the bound is the diagnosis, not the
    # budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Release calls this gate on a tag; depth-one tag checkouts have no
          # origin/main or merge base for the fail-closed strings ratchet.
          fetch-depth: 0

      # No `version:` — see the header. The action reads packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The pnpm store, keyed on the lockfile (ADR 0004, "Caching"). This is
          # why `pnpm install` here is cheap and why nothing ever runs
          # `npm install`: a tree installed by npm is a different tree, and the
          # lockfile is the one this repository has decided to trust.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ordered cheapest-and-most-likely-to-fail first, so a red run says what
      # is wrong in the first screen of output rather than after a test suite.
      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      # The audit harness's own types (`tools/**`, `e2e/**`), which `pnpm typecheck`
      # does not cover. It used to run on every pull request inside e2e.yml's
      # `web-audit` legs; those moved to nightly/on-demand on 2026-11-18 to free
      # the shared job pool, and this one-second check must not leave PRs with them.
      - name: Typecheck the audit harness (tools/, e2e/)
        run: pnpm e2e:typecheck

      # THE i18N RATCHET, enforced where the programme's claim is made. Two
      # separate steps so a red run names which half failed:
      #   1. the generated catalogue projection and typed key surface match the
      #      English JSON (a key added or removed without regenerating is red);
      #   2. no NEW hardcoded user-facing literal has appeared outside the
      #      catalogues (`scripts/i18n/check-strings.ts`, shrink-only baseline).
      # Both run before the unit tests: they are cheap and fail with a precise
      # file:line, and nothing else in this job would notice a new English
      # sentence — it typechecks, passes its tests and ships untranslatable.
      - name: i18n catalogue is current (generate --check)
        run: pnpm i18n:catalogue:check

      - name: i18n strings ratchet (no new hardcoded user-facing text)
        run: pnpm i18n:strings:check

      - name: Unit tests (vitest, Node environment)
        run: pnpm test

      # LINT RUNS AFTER THE APP'S OWN GATES, and the ordering is deliberate: on a
      # tree where `tools/**` is still unformatted (the audit harness arrived
      # without ever meeting biome), a lint failure would otherwise be the first
      # thing to stop the job — and the run would say nothing about whether the
      # app typechecks, passes its tests or bundles. A red gate should not hide
      # the four gates behind it.

      - name: Export the web target
        # The export is also the only build that proves the styling layer
        # compiles: Tailwind/Uniwind are consumed at bundle time, so a token or
        # utility that does not resolve fails here and nowhere else.
        run: pnpm export:web

      - name: Lint (biome check — linter, formatter and import order)
        # A warning-heavy tree can exhaust Biome's default diagnostic cap before
        # any failure is printed. Keep the same whole-tree/error gate and expose
        # its actionable diagnostics; a truncated warning list is not a diagnosis.
        run: pnpm lint --max-diagnostics=1000

      - name: Format check (biome format)
        run: pnpm format:check

      - name: Upload the web export
        uses: actions/upload-artifact@v7
        with:
          name: web-export
          path: dist
          # The frames and reports a design or UX round needs are uploaded by
          # whichever job produces them; this is the bundle those rounds load.
          retention-days: 30

  # Synthetic QA bundle: never built by workflow_call/release or native jobs.
  team-bridge-qa:
    name: Team Bridge QA web artifact (not a release candidate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Reuse checks' established web-build bound, not a new timeout budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select fixture-affecting PRs
        id: fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only "$BASE_SHA...HEAD")
          if printf '%s\n' "$files" | grep -Eq '^(app/|src/(testing/|team-bridge/|features/team-bridge/|i18n/|ui/)|assets/|scripts/ci/team-bridge-qa|package\.json$|pnpm-lock\.yaml$|app\.config\.ts$|metro\.config\.|babel\.config\.|global\.css$|\.github/workflows/ci\.yml$)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.fixture.outputs.needed == 'true'
      - uses: actions/setup-node@v7
        if: steps.fixture.outputs.needed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.fixture.outputs.needed == 'true'
      - name: Export isolated Team Bridge QA target
        if: steps.fixture.outputs.needed == 'true'
        env:
          EXPO_PUBLIC_TEAM_BRIDGE_FIXTURES: "1"
        run: pnpm export:web --output-dir team-bridge-qa-dist
      - name: Record compiled checkout and PR identity
        if: steps.fixture.outputs.needed == 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git rev-parse HEAD > team-bridge-qa-dist/COMPILED_COMMIT_SHA
          printf '%s\n' "$PR_HEAD_SHA" > team-bridge-qa-dist/PR_HEAD_SHA
          cd team-bridge-qa-dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: steps.fixture.outputs.needed == 'true'
        with:
          # Expo generates assets under .pnpm; dropping them breaks the complete
          # SHA256SUMS proof. Include hidden files ONLY from this generated export,
          # never the checkout/home (which could contain .env or credentials).
          name: team-bridge-qa-web-export
          path: team-bridge-qa-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  release-staging:
    name: Release artefact staging (a real upload → download → stage round trip)
    # WHY THIS JOB EXISTS, and why it is not a unit test. The release path stages
    # the downloaded artefacts under their published names, and the step before it
    # depends on WHERE `actions/upload-artifact` puts them: with more than one
    # `path:` entry it uses their least common ancestor as the artefact root, so two
    # Gradle outputs under `android/app/build/outputs/...` arrive as
    # `bundle/release/app-release.aab` and `apk/release/app-release.apk` — not at
    # `artifacts/` root — and the staging `mv` dies (review round 3, B1, reproduced
    # with upload-artifact v7's own findFilesToUpload).
    #
    # An assertion about a "faithful artefacts tree" cannot discriminate: it encodes
    # the very layout under test. So this job performs the real round trip — upload
    # with the release job's own `path:` block, download into `artifacts/`, print
    # what actually arrived, then run the release's own staging script. It needs no
    # credentials, so it runs on every pull request, and it fails on the shape this
    # was written to catch — the first run of this job, on the upload block below
    # before it was changed, listed `artifacts/bundle/release/app-release.aab` and
    # `artifacts/apk/release/app-release.apk` and exited 1 in the staging step (the
    # run is cited in the pull request's evidence table).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `actions: read` is for the visibility wait below (it lists this run's
    # artefacts); `contents: read` restates the workflow default, which a job-level
    # block would otherwise drop. Nothing here writes.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Fake the build outputs the release job uploads
        # Byte-for-byte the relative paths Gradle writes, as an empty file is enough
        # to exercise a path question and a 4 KiB file is enough to survive the
        # round trip.
        run: |
          set -euo pipefail
          mkdir -p android/app/build/outputs/bundle/release \
                   android/app/build/outputs/apk/release \
                   "$RUNNER_TEMP/ipa"
          head -c 4096 /dev/urandom > android/app/build/outputs/bundle/release/app-release.aab
          head -c 4096 /dev/urandom > android/app/build/outputs/apk/release/app-release.apk
          head -c 4096 /dev/urandom > "$RUNNER_TEMP/ipa/exported.ipa"
          find . -name 'app-release.*' -o -name 'exported.ipa' | sort

      - name: Upload them exactly as release.yml does
        # The release's OWN action, with the artefact name changed (a probe artefact
        # must not be mistakable for a release one). Single-sourced on purpose: a
        # probe that re-spells the upload block cannot catch that block drifting
        # away from the staging step it feeds.
        id: upload-android
        uses: ./.github/actions/upload-android-release
        with:
          aab: android/app/build/outputs/bundle/release/app-release.aab
          apk: android/app/build/outputs/apk/release/app-release.apk
          name: android-release-probe

      - name: Upload the IPA exactly as release.yml does
        id: upload-ipa
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-probe
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 1

      - name: Wait until both probe artefacts are listed for this run
        # WHY THIS STEP EXISTS. Uploading and downloading in the SAME job races the
        # artefact backend, whose listing is eventually consistent just after an
        # upload finalizes. Three unrelated pull requests went red here with the
        # artefact not yet visible, each green on one rerun: #348 (job 135857781891,
        # "Artifact not found for name: ios-ipa-probe" ~0.75 s after finalize; the
        # artefact, id 14569594432, existed afterwards), #349 (job 135907423135,
        # "No artifacts found for ID: 14578420722" ~1.23 s after finalize — so an
        # ID-based download alone does not fix it) and #350 (job 136012395453,
        # "Artifact not found for name: ios-ipa-probe" ~1.09 s after finalize).
        # release.yml never meets this race: its downloads run in a later job, long
        # after the build jobs' uploads finalized, so it gets no such wait and the
        # download steps below stay byte-for-byte the shape release.yml uses.
        #
        # THIS ATTEMPT ONLY. A job rerun keeps the run's earlier attempts' artefacts
        # in the listing under the same names (run 44622457070 lists ios-ipa-probe
        # 14578420722 from attempt 1 beside 14579372496 from attempt 2), so a
        # name-only match passes on the first poll of a rerun, before this attempt's
        # uploads are visible. Each entry is therefore `name=<artifact-id>`, the ID
        # the upload step above output, and only that exact pair counts. An empty
        # ID means an upload output went missing: that fails at once, never falls
        # back to names.
        #
        # THE BOUND. Observed lag is ~1 s (n=3 above: 0.75, 1.09, 1.23 s); the limit
        # is 60 s with backoff, well above that, every sleep is capped at the time
        # left so the wait never sleeps past the limit, and the step's own
        # timeout-minutes is the hard stop. Never-visible is a real failure: it
        # exits 1 with the last listing, it is never skipped or continued past.
        #
        # THE LIMIT. download-artifact resolves names through the runtime's internal
        # artefact service, which a shell step cannot call; the public run listing
        # polled here is the nearest observable signal of the same backend. If the
        # two ever diverge, the download below still fails loudly — this narrows the
        # race, it does not hide a failure.
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EXPECTED: android-release-probe=${{ steps.upload-android.outputs.artifact-id }} ios-ipa-probe=${{ steps.upload-ipa.outputs.artifact-id }}
        run: |
          set -euo pipefail
          for entry in $EXPECTED; do
            if [ -z "${entry#*=}" ]; then
              echo "::error::upload step output no artifact-id for ${entry%%=*}; cannot tell this attempt's artefact from an earlier one"
              exit 1
            fi
          done
          limit=60
          start=$SECONDS
          deadline=$((start + limit))
          delay=1
          while :; do
            # A transient API error is just another not-yet-visible poll; the
            # deadline still bounds it.
            listed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | "\(.name)=\(.id)"' 2>&1) || true
            missing=""
            for entry in $EXPECTED; do
              grep -qxF "$entry" <<<"$listed" || missing="$missing $entry"
            done
            if [ -z "$missing" ]; then
              echo "visible after $((SECONDS - start))s: $EXPECTED"
              break
            fi
            left=$((deadline - SECONDS))
            if [ "$left" -le 0 ]; then
              echo "::error::probe artefact(s) not listed for run $RUN_ID within ${limit}s:$missing"
              echo "--- last listing"
              echo "$listed"
              exit 1
            fi
            # Never sleep past the deadline: the next poll lands at it at the latest.
            [ "$delay" -gt "$left" ] && delay=$left
            echo "not yet listed:$missing — retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2 > 8 ? 8 : delay * 2))
          done

      - name: Download them into `artifacts/` exactly as release.yml does
        uses: actions/download-artifact@v8
        with:
          name: android-release-probe
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: ios-ipa-probe
          path: artifacts

      - name: What actually arrived
        # Printed before the assertion, because the interesting failure is a layout
        # mismatch and the listing is what names it.
        run: |
          set -euo pipefail
          echo "--- artifacts/ as the download left it"
          find artifacts -type f | sort

      - name: Stage them exactly as release.yml does
        # release.yml runs this same script, so the two cannot drift.
        run: scripts/ci/stage-release-assets.sh artifacts 1.2.3

      - name: Stage an iOS-only release, which is what RELEASE_PLATFORMS=ios produces
        # The default platform set is iOS only, so the path a tag takes today is a
        # download holding an IPA and NOTHING else. Staging must succeed on exactly
        # that, and must still fail when an enabled platform's artefact is absent —
        # both asserted, because a staging script that quietly accepted a missing
        # IPA would publish an empty Release.
        run: |
          set -euo pipefail
          rm -rf ios-only && mkdir ios-only
          head -c 4096 /dev/urandom > ios-only/exported.ipa
          scripts/ci/stage-release-assets.sh ios-only 1.2.3 ios
          test -s ios-only/local-operator-1.2.3.ipa
          # The asset list `gh release create` receives comes from the same script,
          # so what is attached is exactly what was staged — one file here.
          listed=$(scripts/ci/stage-release-assets.sh --list ios-only 1.2.3 ios)
          test "$listed" = "ios-only/local-operator-1.2.3.ipa" || {
            echo "::error::--list for ios returned: $listed"
            exit 1
          }
          rm -rf empty && mkdir empty
          if scripts/ci/stage-release-assets.sh empty 1.2.3 ios; then
            echo "::error::staging an iOS release with no IPA must fail"
            exit 1
          fi

      - name: Assert the release still uses what this probe exercises
        # THE SINGLE-SOURCING IS OTHERWISE ONE-DIRECTIONAL (review round 4, n2).
        # This job proves the composite action and the staging script work; nothing
        # above proves `release.yml` still calls either of them, so editing the
        # release back to an inline two-path upload would leave this job green and
        # bring the round-3 blocker back with its first red run at a tag. Two greps,
        # and the failure names the file to fix.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # `$VERSION` here is release.yml's own shell
          # variable, quoted literally so the grep matches the file's text.
          for expected in \
            'uses: ./.github/actions/upload-android-release' \
            'run: scripts/ci/stage-release-assets.sh artifacts "$VERSION" "$PLATFORMS"' \
            'stage-release-assets.sh --list artifacts "$VERSION" "$PLATFORMS"'; do
            grep -qF "$expected" .github/workflows/release.yml || {
              echo "::error::release.yml no longer contains: $expected"
              echo "::error::this probe exercises that shape, so release.yml and the probe have drifted — fix release.yml (or the probe) rather than deleting this check."
              exit 1
            }
          done
          echo "release.yml still uploads through the shared action and stages through the shared script"

      - name: Assert the store steps' paths resolve
        # The half that the store steps consume: the Fastfile reads
        # `LO_ANDROID_AAB` by path and globs `LO_IOS_IPA_DIR/*.ipa`, so a staging
        # step that produced the right names in the wrong place would still fail
        # there — this asserts the end of the chain, not just the middle.
        run: |
          set -euo pipefail
          export LO_ANDROID_AAB="$PWD/artifacts/local-operator-1.2.3.aab"
          export LO_IOS_IPA_DIR="$PWD/artifacts"
          test -s "$LO_ANDROID_AAB" || { echo "::error::LO_ANDROID_AAB does not resolve: $LO_ANDROID_AAB"; exit 1; }
          ipas=("$LO_IOS_IPA_DIR"/*.ipa)
          test "${#ipas[@]}" -eq 1 || { echo "::error::the IPA glob found ${#ipas[@]} files, expected 1"; exit 1; }
          echo "LO_ANDROID_AAB -> $LO_ANDROID_AAB ($(wc -c < "$LO_ANDROID_AAB") bytes)"
          echo "LO_IOS_IPA_DIR -> ${ipas[0]}"

  design-kit:
    name: Design kit (tokens, contrast, icons, preview)
    needs: changes
    # Skipped only when a pull request changes none of the gates' inputs (see the
    # `changes` job), and never on `main`, a release gate, a hand-run or the
    # weekly sweep. `scripts/build-theme.ts` regenerates `src/ui` from
    # `design/tokens/tokens.json`, so a styling-layer change is a design change
    # even when the diff looks like app code.
    if: github.event_name != 'pull_request' || needs.changes.outputs.design == 'true'
    # macOS ON PURPOSE, and it is a fidelity decision rather than a convenience.
    # The committed PNGs were rendered on macOS (design/README.md records the
    # reference generation), and every one of these gates re-renders the asset
    # and compares it against the committed file, falling back from a byte
    # comparison to a pixel one. Running that comparison under a different
    # rasterizer and a different font stack would fail for a reason that has
    # nothing to do with the claim the gate makes, which is how a real gate gets
    # ignored. The two tools the gates need are not on the image: an SVG
    # rasterizer (`rsvg-convert`) and ImageMagick 7 (`magick`, whose `compare`
    # subcommand is what the pixel fallback calls), so both are installed below.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Freeze the capture renderer for the whole job
        id: freeze
        # The runner's /Applications/Google Chrome.app is NOT stable for the length
        # of a job: GoogleUpdater replaces it while the job runs. The listing
        # diagnostics showed the `all` and `frames` capture passes on different
        # builds in 11 of 12 runs on main (e.g. 156.0.8078.80, then 157.0.8103.80;
        # one failing run printed 157.0.8103.79 at the tools step and 158.0.8127.36
        # two minutes later), and the listing gate failed in 13 of 78 recent runs
        # with one signature on the caption mark's stroke edge. Rather than widen
        # a pixel tolerance to absorb a renderer swap, every Chrome launch in this
        # job runs ONE copy taken here, before anything uses Chrome. `capture.mjs`
        # and the stale probe (which inherits this environment) honour `CHROME`.
        #
        # A COPY ALONE IS NOT FROZEN (PR #355, run 44855933617): the copy reported
        # 157.0.8103.79 here, the `all` pass rendered with .79 from it, and the
        # `frames` pass three minutes later rendered with .80 from the SAME path.
        # Chrome registers the bundle it is launched from with Google's updater,
        # so the first headless launch of the copy handed the copy to the updater,
        # which updated it in place. Two independent locks, belt and braces,
        # because either alone has a gap:
        #   (a) the updater is stopped for the job — its launchd jobs booted out
        #       (user and system domains) and any running process killed by exact
        #       pid. Labels vary across updater generations (Keystone,
        #       GoogleUpdater, *.wake, *.system), so they are matched by name and
        #       logged; "none found" is fine (an image without it cannot update).
        #       A launchd job we did not see, or one respawned later, is (b)'s job.
        #   (b) the copy and its parent directory are made immutable (`chflags -R
        #       uchg`): no file in it can be written, replaced, renamed or
        #       unlinked, so an updater that does run cannot change it. Chrome
        #       writes nothing into its own bundle (the profile is
        #       --user-data-dir), which the smoke launch below proves on the
        #       locked copy. The flag is cleared again at job end (always()).
        # The drift step re-reads the copy's on-disk version at the end of the job,
        # independently of what CDP reported, so a lock that did not hold fails.
        #
        # Fails closed: no bundle, an original that will not report a version, a
        # swap DURING the copy (before != after), a copy that differs from the
        # original, a copy that will not launch headless, or a copy whose version
        # moved across the lock all stop the job here, by name.
        run: |
          set -euo pipefail
          source="/Applications/Google Chrome.app"
          frozen_dir="$RUNNER_TEMP/chrome-frozen"
          frozen="$frozen_dir/Google Chrome.app"
          original_bin="$source/Contents/MacOS/Google Chrome"
          frozen_bin="$frozen/Contents/MacOS/Google Chrome"
          chrome_version() { "$1" --version 2>&1 | head -1; }
          if [ ! -x "$original_bin" ]; then
            echo "::error::no Chrome at $source — the capture gates cannot run without it"
            exit 1
          fi

          # (a) Stop the updater before the copy exists, so nothing can register
          # or touch it. Logged either way; never fatal.
          updater='google.*(updater|keystone)|keystone|googlesoftwareupdate'
          found=0
          while read -r _pid _status label; do
            [ -n "${label:-}" ] || continue
            found=1
            echo "updater launchd job (gui/$(id -u)): $label — booting out"
            launchctl bootout "gui/$(id -u)/$label" 2>&1 || echo "  bootout of $label failed (the lock below still holds)"
          done < <(launchctl list 2>/dev/null | grep -i -E "$updater" || true)
          while read -r _pid _status label; do
            [ -n "${label:-}" ] || continue
            found=1
            echo "updater launchd job (system): $label — booting out"
            sudo -n launchctl bootout "system/$label" 2>&1 || echo "  bootout of $label failed (the lock below still holds)"
          done < <(sudo -n launchctl list 2>/dev/null | grep -i -E "$updater" || true)
          while read -r pid command; do
            [ -n "${pid:-}" ] || continue
            found=1
            echo "updater process: $pid $command — killing by pid"
            sudo -n kill -TERM "$pid" 2>/dev/null || kill -TERM "$pid" 2>&1 || echo "  kill of $pid failed (the lock below still holds)"
          done < <(pgrep -fl -i "$updater" || true) # macOS pgrep: ERE by default, no -E
          [ "$found" = 1 ] || echo "no Google updater job or process found on this runner"

          before="$(chrome_version "$original_bin")" || {
            echo "::error::the runner's Chrome at $source does not run (--version before the copy: '$before')"
            exit 1
          }
          mkdir -p "$frozen_dir"
          ditto "$source" "$frozen"
          after="$(chrome_version "$original_bin")" || {
            echo "::error::the runner's Chrome at $source does not run (--version after the copy: '$after')"
            exit 1
          }
          version="$(chrome_version "$frozen_bin")" || {
            echo "::error::the frozen Chrome copy does not run: $version"
            exit 1
          }
          if ! [[ "$version" =~ [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::the frozen Chrome copy reported no version: '$version'"
            exit 1
          fi
          if [ "$before" != "$after" ]; then
            echo "::error::Chrome was replaced while it was being frozen (before: '$before', after: '$after', copy: '$version'); re-run the job"
            exit 1
          fi
          if [ "$version" != "$before" ]; then
            echo "::error::the frozen copy differs from the original it was copied from (original: '$before', copy: '$version'); the copy is not that build"
            exit 1
          fi

          # (b) Lock the copy, then prove a locked copy still launches headless —
          # an unlaunchable copy must fail HERE, by name, not later in the
          # preview step whose failure is soft and blamed on fonts. perl's alarm
          # survives exec, so this needs no coreutils `timeout`. 60 s: launch to
          # first CDP answer took 6.8 s (cold, the `all` pass) and 1.8 s (warm,
          # `frames`) in run 44855933617; a dump of about:blank does less.
          chflags -R uchg "$frozen_dir"
          smoke_profile="$RUNNER_TEMP/chrome-frozen-smoke-profile"
          smoke_status=0
          smoke="$(perl -e 'alarm shift; exec @ARGV or die "exec: $!\n"' 60 "$frozen_bin" \
            --headless=new --use-mock-keychain --password-store=basic --no-first-run \
            --no-default-browser-check --user-data-dir="$smoke_profile" --dump-dom about:blank 2>&1)" || smoke_status=$?
          if [ "$smoke_status" != 0 ] || ! grep -q '<html' <<<"$smoke"; then
            echo "::error::the frozen (locked) Chrome copy does not launch headless (exit $smoke_status; 142 = killed at the 60 s limit): $(head -c 600 <<<"$smoke")"
            exit 1
          fi
          locked="$(chrome_version "$frozen_bin")" || {
            echo "::error::the frozen Chrome copy stopped running after it was locked: '$locked'"
            exit 1
          }
          if [ "$locked" != "$version" ]; then
            echo "::error::the frozen copy changed while it was being locked (copied: '$version', now: '$locked')"
            exit 1
          fi
          echo "frozen capture renderer: $version at $frozen (locked; headless smoke launch ok)"
          echo "CHROME=$frozen_bin" >> "$GITHUB_ENV"
          echo "CAPTURE_CHROME_VERSION=$version" >> "$GITHUB_ENV"

      # pnpm is here to RUN package scripts, not to install anything: the design
      # gates are plain `node` programs with no dependencies, which is why this
      # job still never runs `pnpm install` and stays cheap on a docs-only pull
      # request. Going through `pnpm <script>` rather than a file path is what
      # keeps a rename (`build-theme.mjs` → `.ts`) out of CI.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the rasterizer and ImageMagick
        run: brew install librsvg imagemagick

      - name: Are the tools the gates need actually present?
        # A gate that cannot run must fail rather than pass quietly, and the
        # failure has to name the missing tool. `build-icons.mjs --check` and
        # `capture.mjs --check` both do this themselves; this step makes the
        # diagnosis visible before either of them runs.
        run: |
          for tool in rsvg-convert magick; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "::error::$tool is missing — the design gates re-render and compare, so they cannot pass without it"
              exit 1
            fi
          done
          echo "chrome: $("$CHROME" --version 2>&1 | head -1) (frozen copy: $CHROME)"

      - name: Diagnostic retention and metadata allowlists (no browser)
        run: node --test --test-concurrency=1 design/preview/capture-diagnostics.test.mjs design/preview/renderer-drift.test.mjs

      - name: Styling layer is current with the tokens
        # Through the package script, not a path: the file was `.mjs` when this
        # was written and is `.ts` now, and a rename should not touch CI.
        run: pnpm theme:check

      - name: Contrast contract (tokens.json, both themes, and the 59-palette fleet)
        run: node design/tokens/contrast-contract.mjs

      - name: Tailwind preset matches tokens.json
        run: node design/tokens/build-preset.mjs --check

      - name: Desktop palettes are the desktop's (hash pin, re-derived upstream)
        # The 59 desktop palettes the phone ships are a vendored export
        # (design/themes/desktop-palettes.json) until the design kit carries
        # them. This re-derives the export from local-operator-ui at the locked
        # commit (an anonymous public fetch, fork-safe) and fails if a byte
        # differs; the contrast step above then judges every palette.
        run: node design/themes/export-desktop-palettes.mjs --check

      - name: Upstream slice and parity (kit pin, brand roles)
        # ADR 0007 § Decision 2. One command, two checks, two messages: the
        # slice equals the kit at the locked ref (a public→public fetch from
        # raw.githubusercontent.com — no credentials, so it is safe on fork
        # pull requests), and `tokens.json`'s shared brand roles equal the
        # slice (local, no network). The two known differences between this
        # app and the app family are pinned in the script, both values, so a
        # pin fails if either side moves — the same discipline the kit's
        # divergence register uses.
        run: pnpm upstream:check

      - name: Icons, launcher, splash and store assets re-render identically
        run: node design/app-icon/build-icons.mjs --check

      - name: Preview sheet and feature graphic re-render identically
        # runner.temp is a step context, not valid in job-level env.
        env:
          CAPTURE_DIAGNOSTICS_DIR: ${{ runner.temp }}/listing-render-diagnostics
        # `--check` defaults to every target (design/README.md is explicit that a
        # gate whose default scope is narrower than the page it documents is the
        # same defect as one that cannot fail), so this also covers the four
        # committed frames under docs/design/preview AND the nine committed
        # iPhone listing frames under design/store-screenshots/appstore-iphone-6.9.
        # The listing frames do not share the caveat below: their template loads
        # the shipped faces from design/fonts/*.woff2, which ARE in this
        # repository, so that half of the gate verifies on a clean runner even
        # when the sheet cannot.
        #
        # IT FAILS ONLY WHERE IT CAN DISCRIMINATE, and this is a finding rather
        # than a preference. `capture.mjs` renders the sheet with the SHIPPED
        # typefaces (Figtree, JetBrains Mono) by pointing @font-face at a sibling
        # checkout's woff2 files, which are not in this repository; without them
        # the page falls back to the platform face and every committed capture
        # differs. Measured on this workflow's first run (2026-09-30): "preview
        # fonts: no sibling checkout found", then "0 of 5 committed captures
        # verified, 5 stale". A gate that is red on every pull request because a
        # build input is absent is a gate somebody turns off, so until the
        # reference faces are available the mismatch is REPORTED — loudly, and on
        # a marked step — instead of failing the run.
        #
        # The condition names the same two paths `capture.mjs` looks in, so this
        # hardens into the real gate the moment a job provides them (the same
        # sibling checkout, placed there before this step). design/fonts/OFL.txt
        # is already committed, so the licence for shipping them in-repository is
        # in place too.
        run: |
          set -euo pipefail
          reference_fonts=false
          for dir in "$HOME/local-operator-site/public/fonts" "$HOME/local-operator-ui/public/fonts"; do
            if [ -d "$dir" ]; then reference_fonts=true; fi
          done
          if [ "$reference_fonts" = true ]; then
            echo "reference faces present — this is a hard gate on this run"
            node design/preview/capture.mjs --check
          elif node design/preview/capture.mjs --check; then
            echo "preview capture: every committed capture re-rendered identically"
          else
            echo "::warning::the preview capture gate could not make its claim on this run: the shipped typefaces (Figtree, JetBrains Mono) are not available to the capture harness, so the sheet renders in the platform fallback face and every committed capture differs. Reported, not failed — see docs/ci.md, \"When a run goes red\"."
            {
              echo "## Preview capture: NOT VERIFIED"
              echo
              echo "\`design/preview/capture.mjs --check\` re-rendered every committed"
              echo "capture and they all differ from the committed bytes. The cause is"
              echo "that the sheet's shipped typefaces live in a sibling checkout, so it"
              echo "rendered in the platform fallback face."
              echo
              echo "This is a finding about the design kit's gate, not about this"
              echo "pull request: the gate cannot pass on a clean runner until the"
              echo "reference faces are reachable. It becomes a hard failure here as"
              echo "soon as they are."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: The frame-difference arithmetic, on this runner's ImageMagick
        # `Checks` runs on ubuntu-latest with no ImageMagick, so the decoder cases in
        # scripts/design/frame-difference.test.ts skip there. Here the decoder exists,
        # and these are the sizes that matter: 1,080,000 pixels is past the point
        # where the formatter prints scientific notation, which a prefix parse read as
        # 3 — a full-canvas change counted as three pixels (review round 2).
        run: node design/preview/frame-difference.probe.mjs

      - name: The frame gate fails a stale frame with its summary, not an uncaught throw
        # Round 3: `capture.mjs --check` lost its `failures` declaration, so the first
        # stale frame threw ReferenceError after printing that frame's own line — the
        # summary never printed, the rest of the set went unchecked, and the browser
        # tree leaked (nine orphans reaped at job end). CI stayed green only because
        # the step that reached it is the soft-fail preview one. This drives the stale
        # path for real, against a one-frame tree.
        run: node design/preview/capture-stale.probe.mjs

      - name: The committed listing frames re-render identically
        id: listing
        env:
          CAPTURE_DIAGNOSTICS_DIR: ${{ runner.temp }}/listing-render-diagnostics
        # A HARD gate, and separate from the step above on purpose. That step has
        # to tolerate failure while the preview sheet's shipped faces live in a
        # sibling checkout (docs/ci.md, "When a run goes red"), so a stale LISTING
        # would have merged green behind its warning. These 26 frames (nine iPhone,
        # nine iPad, eight Play) have no such excuse: every template loads the
        # faces from this repository and the captures they compose are committed
        # beside them, so a frame that no longer matches its caption, its page or
        # its capture fails here.
        #
        # Byte-for-byte on the machine that rendered them; on a runner whose Chrome
        # encodes PNGs differently, pixels within each surface's `compareFuzz`
        # tolerance from `frames.json` (per surface, and every surface needs one —
        # the encoder difference moves a few hundred pixels even where nothing is
        # resampled). `capture.mjs` prints which comparison it made, how many pixels
        # the tolerance had to absorb at zero tolerance, and the largest channel
        # difference, so the values can be re-derived from the log.
        run: node design/preview/capture.mjs --target frames --check

      - name: The capture renderer did not change mid-job
        # The other half of the freeze step: proof it held, two ways. Both capture
        # passes above write the Chrome build they rendered with into the
        # diagnostics directory (renderer.json), and this also re-runs the frozen
        # copy's own `--version` NOW, independently of CDP (a pass whose renderer
        # CDP could not report still cannot hide an on-disk change). It fails,
        # naming every version, if any of them differs from the version frozen.
        # It runs even when the listing gate failed, because a stale frame next to
        # a renderer swap is a harness failure, not a design finding — but only
        # when the freeze succeeded (otherwise there is nothing to check and the
        # freeze step already failed by name) and the listing step actually ran
        # (an unrelated earlier failure skips it, and "no renderer recorded"
        # would then be a misleading warning). A pass whose renderer could not be
        # read is a warning only (renderer facts never decide a verdict alone).
        if: ${{ !cancelled() && steps.freeze.outcome == 'success' && (steps.listing.outcome == 'success' || steps.listing.outcome == 'failure') }}
        run: node design/preview/renderer-drift.mjs "$RUNNER_TEMP/listing-render-diagnostics" "$CAPTURE_CHROME_VERSION" "$CHROME"

      - name: Upload listing renderer diagnostics even when the gate fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: listing-render-diagnostics
          path: ${{ runner.temp }}/listing-render-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Render the preview sheet for the review rounds
        # These are the frames a designer or UX round looks at. They are written
        # into the tree by the generator and uploaded as an artefact, never
        # committed from CI — a frame is evidence about a revision, not a file
        # the repository should carry a second copy of.
        run: node design/preview/capture.mjs

      - name: Upload the rendered frames
        uses: actions/upload-artifact@v7
        with:
          name: design-previews
          path: |
            docs/design/preview/*.png
            design/app-icon/store/play-feature-graphic-1024x500.png
          retention-days: 30

      - name: Unlock the frozen capture renderer
        # The freeze step made the copy immutable (chflags uchg); clear that so
        # the runner's own temp-directory cleanup can delete it. Never fails the
        # job: a hosted VM is discarded anyway, and there may be no copy at all.
        if: always()
        run: chflags -R nouchg "$RUNNER_TEMP/chrome-frozen" 2>/dev/null || true

  # ONE stable check name (`CI Gate`) to require on every pull request and read
  # before arming the merge gate (`pnpm merge-gate <pr>`). Requiring individual
  # jobs makes every job rename or addition a ruleset edit that strands in-flight
  # pull requests; requiring this aggregate does not.
  #
  # FAIL CLOSED (`if: always()`, invariant I2):
  #   * `changes`, `checks`, and `release-staging` MUST conclude `success` on
  #     every trigger — never `skipped`, `failure`, or `cancelled`.
  #   * `team-bridge-qa` runs only when `github.event_name == 'pull_request'`:
  #     it MUST be `success` on `pull_request`, and `skipped` on non-PR triggers.
  #   * `design-kit` is path-gated by `changes.outputs.design`: it may conclude
  #     `skipped` ONLY on a `pull_request` whose classifier explicitly wrote
  #     `design == 'false'`. On every other trigger — or if `changes` failed or
  #     emitted an empty/unknown output — `skipped` is rejected as a failure.
  ci-gate:
    name: CI Gate
    needs:
      - changes
      - checks
      - team-bridge-qa
      - release-staging
      - design-kit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify fast-tier jobs succeeded (fail closed)
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          DESIGN_NEEDED: ${{ needs.changes.outputs.design }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.NEEDS ?? "{}");
          const event = process.env.EVENT ?? "";
          const designNeeded = process.env.DESIGN_NEEDED ?? "";

          const expected = ["changes", "checks", "team-bridge-qa", "release-staging", "design-kit"];
          const bad = [];

          for (const job of expected) {
            const result = needs[job]?.result ?? "missing";
            console.log(`${job}: ${result}`);
            if (job === "team-bridge-qa") {
              const ok = event === "pull_request" ? result === "success" : result === "skipped";
              if (!ok) bad.push(`${job}=${result} (event=${event})`);
              continue;
            }
            if (job === "design-kit") {
              const allowedSkip =
                event === "pull_request" &&
                needs.changes?.result === "success" &&
                designNeeded === "false";
              const ok = result === "success" || (result === "skipped" && allowedSkip);
              if (!ok) bad.push(`${job}=${result} (design=${designNeeded || "<empty>"}, event=${event})`);
              continue;
            }
            if (result !== "success") {
              bad.push(`${job}=${result}`);
            }
          }

          for (const [job, entry] of Object.entries(needs)) {
            if (!expected.includes(job) && entry?.result !== "success") {
              bad.push(`${job}=${entry?.result ?? "unknown"}`);
            }
          }

          if (bad.length > 0) {
            console.log(`::error title=CI Gate::${bad.join(", ")}`);
            process.exit(1);
          }
          console.log("CI Gate green on this head.");
          NODE
