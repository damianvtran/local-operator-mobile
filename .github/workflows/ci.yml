name: CI

# The gate every pull request pays for, and the same gate on `main`.
#
# WHAT THIS WORKFLOW IS FOR. The primary development machine has no Xcode and no
# Android SDK, and the native jobs live in android.yml and ios.yml — but the
# *logic* of this app is JavaScript, and the fastest honest signal on a change is
# still lint + types + unit tests + the web export. Those four run here, on
# Linux, in minutes. A change that cannot typecheck or whose tests fail should
# never be the reason a macOS runner was queued.
#
# ACTIONS ARE PINNED TWO WAYS, DELIBERATELY (ADR 0004, "Supply-chain hygiene"):
#   * `actions/*`, `pnpm/action-setup` and `actions/setup-java` track a major tag
#     (`checkout@v7`), because GitHub maintains them and a major tag is the
#     conventional way to consume them;
#   * every third-party action is pinned to a FULL COMMIT SHA with the release it
#     corresponds to in a comment, because a compromised third-party action
#     running in a release job holds the signing key. The SHA is the only pin a
#     tag cannot be moved out from under.
# `version` is omitted from pnpm/action-setup on purpose: the action reads
# `packageManager` from package.json, so the pnpm version has exactly one home.
#
# NO PATH FILTER IN `on.paths`. A workflow excluded by a path filter does not
# "skip" — it never runs, and a required check that never runs stays pending
# forever, which is unreachable-for-merge. Expensive jobs are gated by an `if:`
# on a `changes` job instead (android.yml, ios.yml and now this file's
# `design-kit`, which pays for a macOS runner): the workflow always runs, so a
# required check always reports, and the skip is visible as a skipped job.

on:
  push:
    branches:
      # `main` only. A feature branch with an open pull request would otherwise
      # fire a `push` run and a `pull_request` run for one identical result.
      - main
  pull_request:
  workflow_dispatch:
  # Callable, so release.yml can run the SAME gate a pull request runs rather
  # than a second copy of it. "What shipped == what CI ran" is a property worth
  # having structurally instead of by diligence.
  workflow_call:
  # A weekly sweep, because the design gates compare RE-RENDERED artefacts and a
  # rasterizer or font on a runner image can change without this repository
  # changing. Without it, the first evidence of that drift would be a PR that
  # touches nothing design-related and still fails.
  schedule:
    - cron: "0 6 * * 1"

# One in-flight run per ref. A review cycle pushes repeatedly, and without this
# every superseded push kept its job set queued. `main` is exempt: an in-flight
# `main` run is the record for a merge and cancelling it loses that record.
#
# `github.event_name` IS PART OF THE GROUP, and it is what keeps the release gate
# from cancelling itself. When release.yml calls this workflow, `github.workflow`
# inside the callee is the CALLER's name, so a group of `workflow-ref` alone is
# identical to release.yml's own group — GitHub's documented outcome is
# "Canceling since a deadlock for concurrency group … was detected between 'top
# level workflow' and …", i.e. the release's `gate` job is cancelled before it
# starts. The event name makes the call site distinct (`…-workflow_call`).
# `cancel-in-progress` is scoped to pull requests for the same reason: a tag run
# is a release in progress, and cancelling it would drop the artefacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing here writes. The release workflow is the one place
# that elevates, and only for the job that creates a Release.
permissions:
  contents: read

env:
  # Expo's floor is Node 22.13+ / 24.3+; 24 is what the repository is developed
  # on, so CI runs the version the app is written against.
  # Node >= 24, and it is not a preference: every tool in this repository is
  # TypeScript executed directly, which needs native type stripping (unflagged
  # from Node 23.6). On anything older the gates do not run at all.
  NODE_VERSION: "24"

jobs:
  changes:
    name: Does this change touch the design gates' inputs?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      design: ${{ steps.diff.outputs.design }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the base commit, not just the head.
          fetch-depth: 0

      - name: Decide whether the macOS design job is worth running
        # The design gates re-render committed artefacts and compare them, which
        # needs macOS (the committed PNGs were generated there), `librsvg`,
        # ImageMagick and a `brew install` — the most expensive thing in this
        # workflow. Path-gating it is the same trade android.yml and ios.yml
        # already make (review M4); it still runs on every `main` push, on a
        # weekly schedule, and inside a release gate, so drift cannot hide.
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Not a pull request: `main` is the record, a hand-run is somebody
          # asking for this pipeline on purpose, a release gate must cover the
          # whole gate, and the schedule is the sweep. All of those run it.
          if [ "$EVENT" != "pull_request" ]; then
            echo "design=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          files=$(git diff --name-only "FETCH_HEAD...HEAD")
          if [ -z "$files" ]; then
            # An empty diff is not evidence that nothing design-related changed.
            echo "design=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The inputs these gates read, and the generators that produce the
          # files they compare: the token source, the committed assets and
          # frames, the generated styling layer in `src/ui`, the theme generator,
          # and the gate scripts themselves. A change confined to anything else
          # cannot alter a re-render.
          design=$(printf '%s\n' "$files" \
            | grep -E '^(design/|docs/design/|src/ui/|scripts/|tailwind\.config\.|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)' \
            || true)
          if [ -n "$design" ]; then
            echo "design=true" >> "$GITHUB_OUTPUT"
            printf 'design surfaces touched:\n%s\n' "$(printf '%s\n' "$design" | head -20)"
          else
            echo "design=false" >> "$GITHUB_OUTPUT"
            echo "nothing under design/, docs/design/, src/ui/, scripts/ or the configs changed — the macOS design job is skipped"
          fi

  checks:
    name: Checks (lint, format, types, unit tests, web export)
    runs-on: ubuntu-latest
    # Bounded so a wedged step cannot hold a runner for GitHub's 360-minute
    # default. A cold run is 4-7 minutes; the bound is the diagnosis, not the
    # budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # No `version:` — see the header. The action reads packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The pnpm store, keyed on the lockfile (ADR 0004, "Caching"). This is
          # why `pnpm install` here is cheap and why nothing ever runs
          # `npm install`: a tree installed by npm is a different tree, and the
          # lockfile is the one this repository has decided to trust.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ordered cheapest-and-most-likely-to-fail first, so a red run says what
      # is wrong in the first screen of output rather than after a test suite.
      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Unit tests (vitest, Node environment)
        run: pnpm test

      # LINT RUNS AFTER THE APP'S OWN GATES, and the ordering is deliberate: on a
      # tree where `tools/**` is still unformatted (the audit harness arrived
      # without ever meeting biome), a lint failure would otherwise be the first
      # thing to stop the job — and the run would say nothing about whether the
      # app typechecks, passes its tests or bundles. A red gate should not hide
      # the four gates behind it.

      - name: Export the web target
        # The export is also the only build that proves the styling layer
        # compiles: Tailwind/Uniwind are consumed at bundle time, so a token or
        # utility that does not resolve fails here and nowhere else.
        run: pnpm export:web

      - name: Lint (biome check — linter, formatter and import order)
        run: pnpm lint

      - name: Format check (biome format)
        run: pnpm format:check

      - name: Upload the web export
        uses: actions/upload-artifact@v7
        with:
          name: web-export
          path: dist
          # The frames and reports a design or UX round needs are uploaded by
          # whichever job produces them; this is the bundle those rounds load.
          retention-days: 30

  release-staging:
    name: Release artefact staging (a real upload → download → stage round trip)
    # WHY THIS JOB EXISTS, and why it is not a unit test. The release path stages
    # the downloaded artefacts under their published names, and the step before it
    # depends on WHERE `actions/upload-artifact` puts them: with more than one
    # `path:` entry it uses their least common ancestor as the artefact root, so two
    # Gradle outputs under `android/app/build/outputs/...` arrive as
    # `bundle/release/app-release.aab` and `apk/release/app-release.apk` — not at
    # `artifacts/` root — and the staging `mv` dies (review round 3, B1, reproduced
    # with upload-artifact v7's own findFilesToUpload).
    #
    # An assertion about a "faithful artefacts tree" cannot discriminate: it encodes
    # the very layout under test. So this job performs the real round trip — upload
    # with the release job's own `path:` block, download into `artifacts/`, print
    # what actually arrived, then run the release's own staging script. It needs no
    # credentials, so it runs on every pull request, and it fails on the shape this
    # was written to catch — the first run of this job, on the upload block below
    # before it was changed, listed `artifacts/bundle/release/app-release.aab` and
    # `artifacts/apk/release/app-release.apk` and exited 1 in the staging step (the
    # run is cited in the pull request's evidence table).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fake the build outputs the release job uploads
        # Byte-for-byte the relative paths Gradle writes, as an empty file is enough
        # to exercise a path question and a 4 KiB file is enough to survive the
        # round trip.
        run: |
          set -euo pipefail
          mkdir -p android/app/build/outputs/bundle/release \
                   android/app/build/outputs/apk/release \
                   "$RUNNER_TEMP/ipa"
          head -c 4096 /dev/urandom > android/app/build/outputs/bundle/release/app-release.aab
          head -c 4096 /dev/urandom > android/app/build/outputs/apk/release/app-release.apk
          head -c 4096 /dev/urandom > "$RUNNER_TEMP/ipa/exported.ipa"
          find . -name 'app-release.*' -o -name 'exported.ipa' | sort

      - name: Upload them exactly as release.yml does
        # The release's OWN action, with the artefact name changed (a probe artefact
        # must not be mistakable for a release one). Single-sourced on purpose: a
        # probe that re-spells the upload block cannot catch that block drifting
        # away from the staging step it feeds.
        uses: ./.github/actions/upload-android-release
        with:
          aab: android/app/build/outputs/bundle/release/app-release.aab
          apk: android/app/build/outputs/apk/release/app-release.apk
          name: android-release-probe

      - name: Upload the IPA exactly as release.yml does
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-probe
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 1

      - name: Download them into `artifacts/` exactly as release.yml does
        uses: actions/download-artifact@v8
        with:
          name: android-release-probe
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: ios-ipa-probe
          path: artifacts

      - name: What actually arrived
        # Printed before the assertion, because the interesting failure is a layout
        # mismatch and the listing is what names it.
        run: |
          set -euo pipefail
          echo "--- artifacts/ as the download left it"
          find artifacts -type f | sort

      - name: Stage them exactly as release.yml does
        # release.yml runs this same script, so the two cannot drift.
        run: scripts/ci/stage-release-assets.sh artifacts 1.2.3

      - name: Assert the store steps' paths resolve
        # The half that the store steps consume: the Fastfile reads
        # `LO_ANDROID_AAB` by path and globs `LO_IOS_IPA_DIR/*.ipa`, so a staging
        # step that produced the right names in the wrong place would still fail
        # there — this asserts the end of the chain, not just the middle.
        run: |
          set -euo pipefail
          export LO_ANDROID_AAB="$PWD/artifacts/local-operator-1.2.3.aab"
          export LO_IOS_IPA_DIR="$PWD/artifacts"
          test -s "$LO_ANDROID_AAB" || { echo "::error::LO_ANDROID_AAB does not resolve: $LO_ANDROID_AAB"; exit 1; }
          ipas=("$LO_IOS_IPA_DIR"/*.ipa)
          test "${#ipas[@]}" -eq 1 || { echo "::error::the IPA glob found ${#ipas[@]} files, expected 1"; exit 1; }
          echo "LO_ANDROID_AAB -> $LO_ANDROID_AAB ($(wc -c < "$LO_ANDROID_AAB") bytes)"
          echo "LO_IOS_IPA_DIR -> ${ipas[0]}"

  design-kit:
    name: Design kit (tokens, contrast, icons, preview)
    needs: changes
    # Skipped only when a pull request changes none of the gates' inputs (see the
    # `changes` job), and never on `main`, a release gate, a hand-run or the
    # weekly sweep. `scripts/build-theme.ts` regenerates `src/ui` from
    # `design/tokens/tokens.json`, so a styling-layer change is a design change
    # even when the diff looks like app code.
    if: github.event_name != 'pull_request' || needs.changes.outputs.design == 'true'
    # macOS ON PURPOSE, and it is a fidelity decision rather than a convenience.
    # The committed PNGs were rendered on macOS (design/README.md records the
    # reference generation), and every one of these gates re-renders the asset
    # and compares it against the committed file, falling back from a byte
    # comparison to a pixel one. Running that comparison under a different
    # rasterizer and a different font stack would fail for a reason that has
    # nothing to do with the claim the gate makes, which is how a real gate gets
    # ignored. The two tools the gates need are not on the image: an SVG
    # rasterizer (`rsvg-convert`) and ImageMagick 7 (`magick`, whose `compare`
    # subcommand is what the pixel fallback calls), so both are installed below.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # pnpm is here to RUN package scripts, not to install anything: the design
      # gates are plain `node` programs with no dependencies, which is why this
      # job still never runs `pnpm install` and stays cheap on a docs-only pull
      # request. Going through `pnpm <script>` rather than a file path is what
      # keeps a rename (`build-theme.mjs` → `.ts`) out of CI.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the rasterizer and ImageMagick
        run: brew install librsvg imagemagick

      - name: Are the tools the gates need actually present?
        # A gate that cannot run must fail rather than pass quietly, and the
        # failure has to name the missing tool. `build-icons.mjs --check` and
        # `capture.mjs --check` both do this themselves; this step makes the
        # diagnosis visible before either of them runs.
        run: |
          for tool in rsvg-convert magick; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $("$tool" --version 2>&1 | head -1)"
            else
              echo "::error::$tool is missing — the design gates re-render and compare, so they cannot pass without it"
              exit 1
            fi
          done
          echo "chrome: $(/Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version 2>&1 | head -1)"

      - name: Styling layer is current with the tokens
        # Through the package script, not a path: the file was `.mjs` when this
        # was written and is `.ts` now, and a rename should not touch CI.
        run: pnpm theme:check

      - name: Contrast contract (tokens.json, both themes)
        run: node design/tokens/contrast-contract.mjs

      - name: Tailwind preset matches tokens.json
        run: node design/tokens/build-preset.mjs --check

      - name: Icons, launcher, splash and store assets re-render identically
        run: node design/app-icon/build-icons.mjs --check

      - name: Preview sheet and feature graphic re-render identically
        # `--check` defaults to every target (design/README.md is explicit that a
        # gate whose default scope is narrower than the page it documents is the
        # same defect as one that cannot fail), so this also covers the four
        # committed frames under docs/design/preview.
        #
        # IT FAILS ONLY WHERE IT CAN DISCRIMINATE, and this is a finding rather
        # than a preference. `capture.mjs` renders the sheet with the SHIPPED
        # typefaces (Figtree, JetBrains Mono) by pointing @font-face at a sibling
        # checkout's woff2 files, which are not in this repository; without them
        # the page falls back to the platform face and every committed capture
        # differs. Measured on this workflow's first run (2026-09-30): "preview
        # fonts: no sibling checkout found", then "0 of 5 committed captures
        # verified, 5 stale". A gate that is red on every pull request because a
        # build input is absent is a gate somebody turns off, so until the
        # reference faces are available the mismatch is REPORTED — loudly, and on
        # a marked step — instead of failing the run.
        #
        # The condition names the same two paths `capture.mjs` looks in, so this
        # hardens into the real gate the moment a job provides them (the same
        # sibling checkout, placed there before this step). design/fonts/OFL.txt
        # is already committed, so the licence for shipping them in-repository is
        # in place too.
        run: |
          set -euo pipefail
          reference_fonts=false
          for dir in "$HOME/local-operator-site/public/fonts" "$HOME/local-operator-ui/public/fonts"; do
            if [ -d "$dir" ]; then reference_fonts=true; fi
          done
          if [ "$reference_fonts" = true ]; then
            echo "reference faces present — this is a hard gate on this run"
            node design/preview/capture.mjs --check
          elif node design/preview/capture.mjs --check; then
            echo "preview capture: every committed capture re-rendered identically"
          else
            echo "::warning::the preview capture gate could not make its claim on this run: the shipped typefaces (Figtree, JetBrains Mono) are not available to the capture harness, so the sheet renders in the platform fallback face and every committed capture differs. Reported, not failed — see docs/ci.md, \"When a run goes red\"."
            {
              echo "## Preview capture: NOT VERIFIED"
              echo
              echo "\`design/preview/capture.mjs --check\` re-rendered every committed"
              echo "capture and they all differ from the committed bytes. The cause is"
              echo "that the sheet's shipped typefaces live in a sibling checkout, so it"
              echo "rendered in the platform fallback face."
              echo
              echo "This is a finding about the design kit's gate, not about this"
              echo "pull request: the gate cannot pass on a clean runner until the"
              echo "reference faces are reachable. It becomes a hard failure here as"
              echo "soon as they are."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Render the preview sheet for the review rounds
        # These are the frames a designer or UX round looks at. They are written
        # into the tree by the generator and uploaded as an artefact, never
        # committed from CI — a frame is evidence about a revision, not a file
        # the repository should carry a second copy of.
        run: node design/preview/capture.mjs

      - name: Upload the rendered frames
        uses: actions/upload-artifact@v7
        with:
          name: design-previews
          path: |
            docs/design/preview/*.png
            design/app-icon/store/play-feature-graphic-1024x500.png
          retention-days: 30
