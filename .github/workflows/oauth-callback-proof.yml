name: iOS OAuth callback proof

on:
  pull_request:
    paths:
      - modules/radient-loopback/**
      - src/connection/loopback.ts
      - src/connection/radient-oauth.ts
      - scripts/ci/oauth-callback-proof/**
      - .github/workflows/oauth-callback-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-callback-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-native:
    name: Real system browser to IPv4 loopback
    runs-on: macos-26
    # Serial modes avoid another native runner: allow compile/boot (~6m), four
    # cold driver sessions (~8m), the REAL 5m timeout, bounded case waits (~6m)
    # and evidence/reaping (~3m). The observed 20m cutoff interrupted timeout;
    # this outer 35m budget does not alter any native deadline or PASS assertion.
    timeout-minutes: 35
    env:
      MAESTRO_VERSION: "2.11.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Record actual hosted native toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install the repo-pinned hosted UI driver
        run: |
          set -euo pipefail
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Compile production transport and exercise real browser callbacks
        run: bash scripts/ci/oauth-callback-proof/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: oauth-callback-native-${{ github.sha }}
          path: ${{ runner.temp }}/oauth-callback-proof/evidence/
