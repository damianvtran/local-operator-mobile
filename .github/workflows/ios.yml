name: iOS

# The iOS native gate.
#
# WHAT IT PROVES WITHOUT ANY SECRET. A simulator build needs no signing at all,
# which is what makes it the right first native gate for a public repository: a
# fork pull request, a contributor with no Apple Developer membership and a
# maintainer who has not configured the secrets all get the same answer, and it
# is a real one — the app compiles for the iOS 26 SDK on the Xcode 26 runner, and
# it LAUNCHES, and the frame it renders is captured.
#
# WHY A RELEASE CONFIGURATION FOR THE SIMULATOR BUILD. A Debug build of a React
# Native app expects a Metro dev server at runtime: launched on a simulator it
# renders a red error screen, and a screenshot of that proves nothing about the
# app. A Release build embeds the JavaScript bundle, so the launched app renders
# the real UI. The cost is one bundling pass, which is cheaper than a frame
# nobody can trust.
#
# WHY THERE ARE TWO JOBS. The simulator job needs no credential and runs on every
# change; the `internal` job signs and can reach TestFlight, so it runs only on a
# push to `main` and declares `environment: release`. See android.yml for the
# full reasoning: the split is what makes the Apple key unreachable from a pull
# request rather than merely withheld from a fork.
#
# A TAG IS NOT HANDLED HERE. release.yml owns `v*`; a tag that also signed here
# would upload to TestFlight twice.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # The simulator is a pinned input, in one place (ADR 0004, open risks). macOS
  # runner images track Xcode releases, so `scripts/ci/ios-simulator.ts` resolves
  # this name against what the runner actually has, prints what it chose, and
  # warns rather than failing when the image has moved on.
  IOS_SIMULATOR_DEVICE: iPhone 17

jobs:
  changes:
    name: Does this change touch anything native?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the native jobs are worth running
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Not a pull request: `main` is a release signal and a hand-run is
          # somebody asking for this pipeline on purpose, so both run everything.
          if [ "$EVENT" != "pull_request" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          files=$(git diff --name-only "FETCH_HEAD...HEAD")
          if [ -z "$files" ]; then
            # An empty diff is not evidence that nothing native changed.
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skipped only when EVERY changed file is documentation. Anything else,
          # a workflow file included, runs the native jobs.
          other=$(printf '%s\n' "$files" | grep -v -E '^(docs/|.*\.md$)' || true)
          if [ -n "$other" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            printf 'native surfaces touched:\n%s\n' "$(printf '%s\n' "$other" | head -20)"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "documentation only (docs/** or *.md) — the native jobs are skipped"
          fi

  ios:
    name: iOS (simulator build, launch and frame)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # `macos-26` is the image that carries Xcode 26.x, which is what Apple's
    # upload requirement is written against (ADR 0004).
    runs-on: macos-26
    # macOS minutes are the pipeline's bottleneck. A cold run is 12-20 minutes;
    # the bound is the diagnosis for a wedged one, not the budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count of this ref, so a shallow clone
          # would derive a number that is too low — and the version step below
          # refuses a shallow clone rather than guessing. Measured on run
          # 36755424255, where this checkout had no `fetch-depth` and the step
          # failed with exactly that message.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v6
        # Expo's Android config is evaluated by `expo prebuild` even for an
        # `--platform ios` run, and the Java toolchain keeps that path from
        # depending on whatever JDK the image happens to default to.
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive the version from the ref
        run: node scripts/ci/version.ts --write

      - name: Generate the native project
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Snapshot the generated project, before anything else touches it
        # BEFORE `pod install`, and this placement is the whole correctness of the
        # determinism check. CocoaPods rewrites the generated tree as a matter of
        # course — it creates `Podfile.lock` and `contents.xcworkspacedata`, and
        # its post-install hook edits `project.pbxproj` — and the build then
        # stamps `Info.plist`. Comparing a post-pods tree against a
        # `prebuild --clean --no-install` regeneration reported five differences,
        # all of them CocoaPods talking to itself (measured: run 36669424052),
        # which is the "gate that fails for the wrong reason" this check exists to
        # avoid. Snapshotted here, the comparison is prebuild against prebuild:
        # the claim is that the CONFIG reproduces the project, and nothing else.
        run: cp -R ios "$RUNNER_TEMP/ios-built"

      - name: Install the pods
        # Separate from prebuild so each step has one job: prebuild generates,
        # and this resolves the native dependencies. CocoaPods 1.17.0 is on the
        # image; `pod install` is idempotent, so it costs nothing when a
        # Podfile.lock did not change.
        run: cd ios && pod install

      - name: Resolve the simulator
        id: simulator
        env:
          DEVICE: ${{ env.IOS_SIMULATOR_DEVICE }}
        run: node scripts/ci/ios-simulator.ts --prefer "$DEVICE"

      - name: Resolve the workspace and scheme
        id: project
        # Resolved rather than written down: `expo prebuild` names the workspace
        # and scheme after the app's sanitised name, and a second copy of that
        # name here is a copy that can disagree with app.config.ts. The script
        # also fails loudly when there is no workspace (which means `pod install`
        # never ran) or when the project declares more than one scheme.
        run: node scripts/ci/ios-project.ts --root ios

      - name: Build for the simulator (no signing at all)
        # `CODE_SIGNING_ALLOWED=NO` is what lets this run with ZERO secrets. It
        # is not a way of ignoring a signing problem: a simulator build genuinely
        # has no signing step, and the signed path is the `internal` job.
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.project.outputs.workspace }}" \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -configuration Release \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Assert the built Info.plist carries the local-network configuration
        # THE BUILT PRODUCT, NOT THE SOURCE PLIST. `plutil` reads the plist INSIDE
        # the .app this build just produced, so a config change that never reached
        # the product fails here. WHICH mechanism iOS honours for a literal private
        # IP — the local-networking boolean or the CIDR exception domains — is
        # genuinely ambiguous in Apple's current documentation (ADR 0002 §5); the
        # §7 S10 device procedure settles that, and this asserts what shipped.
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "*.app" -type d | head -1)
          echo "app: $app"
          plutil -convert json -o "$RUNNER_TEMP/Info.json" "$app/Info.plist"
          node scripts/ci/native-config.ts ios "$RUNNER_TEMP/Info.json"

      - name: Boot the simulator
        id: boot
        run: |
          set -euo pipefail
          udid="${{ steps.simulator.outputs.udid }}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          mkdir -p "$RUNNER_TEMP/frames"
          # The home screen, captured BEFORE anything is installed, so the frame
          # after launch has something to be different from. Without a baseline, a
          # screenshot of a black screen or of the springboard is indistinguishable
          # from a screenshot of the app.
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/frames/ios-baseline.png"

      - name: Install the app, assert the version it carries, and launch it
        # A build that produces a .app which cannot start is not a working app,
        # and this is the cheapest honest way to find that out without a device.
        run: |
          set -euo pipefail
          udid="${{ steps.simulator.outputs.udid }}"
          app=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "*.app" -type d | head -1)
          echo "app: $app"
          # Read the identity from the app the build produced rather than
          # repeating it here: the bundle id lives in app.config.ts, and a second
          # copy in a workflow is a copy that can disagree with it.
          bundle=$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")
          echo "bundle: $bundle"

          # THE VERSION IS READ OUT OF THE ARTEFACT, not out of the environment.
          # `scripts/ci/version.ts` exports it, `app.config.ts` consumes it, and
          # this asserts the two ends meet where it matters — the Info.plist of
          # the built app. An environment variable nothing consumes is the defect
          # this step exists to catch (review B1 on this pull request).
          short=$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")
          build=$(plutil -extract CFBundleVersion raw "$app/Info.plist")
          echo "built: CFBundleShortVersionString=$short CFBundleVersion=$build"
          {
            echo "| field | built | derived from the ref |"
            echo "|---|---|---|"
            echo "| CFBundleShortVersionString | \`$short\` | \`$LOCAL_OPERATOR_MOBILE_VERSION\` |"
            echo "| CFBundleVersion | \`$build\` | \`$LOCAL_OPERATOR_MOBILE_VERSION_CODE\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$short" != "$LOCAL_OPERATOR_MOBILE_VERSION" ]; then
            echo "::error::the built app carries version '$short' but the ref derived '$LOCAL_OPERATOR_MOBILE_VERSION' — the version did not reach the artefact"
            exit 1
          fi
          if [ "$build" != "$LOCAL_OPERATOR_MOBILE_VERSION_CODE" ]; then
            echo "::error::the built app carries CFBundleVersion '$build' but the run derived '$LOCAL_OPERATOR_MOBILE_VERSION_CODE'"
            exit 1
          fi

          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$bundle"

      - name: Capture the frame the app renders, and assert it rendered
        # WHAT THIS ASSERTS, AND WHY IT DOES NOT GATE ON "SETTLED".
        # Two hard assertions: the frame after launch must differ from the
        # pre-install home screen (so the app painted something rather than
        # showing a black screen or the springboard), and the launch log must
        # carry no JavaScript fatal (so what it painted is not an error screen —
        # the check that caught the real crash this app had without its routes).
        #
        # A THIRD CHECK WAS TRIED AND REMOVED, with the measurement: requiring the
        # still to be byte-identical to a capture two seconds later. Measured on
        # 2026-09-30 (run 36727261140), the app — which is a live client with a
        # caret and settling panels — legitimately moves between the two frames,
        # so byte-identity is a gate that can only ever be red on a working app.
        # A permanently red gate is one people learn to ignore, so the settle is
        # measured and REPORTED instead, in a unit that means something (a
        # pixel-channel delta, not a compressed-byte delta), and pixel-level
        # judgement stays with the audit harness (ADR 0003).
        run: |
          set -euo pipefail
          udid="${{ steps.simulator.outputs.udid }}"
          frames="$RUNNER_TEMP/frames"
          sleep 5
          xcrun simctl io "$udid" screenshot "$frames/ios-release.png"
          sleep 2
          xcrun simctl io "$udid" screenshot "$frames/ios-release+2s.png"

          if cmp -s "$frames/ios-baseline.png" "$frames/ios-release.png"; then
            echo "::error::the frame after launch is byte-identical to the home screen captured before it: the app did not render"
            exit 1
          fi

          # Decoded to an uncompressed bitmap first: comparing two PNGs byte-wise
          # measures the compressor, not the screen, so a one-pixel change can
          # read as a huge difference and a whole-screen change can read as none.
          # The count is capped because a full-screen animation would otherwise
          # stream millions of lines for no extra information.
          sips -s format bmp "$frames/ios-release.png" --out "$RUNNER_TEMP/frame-a.bmp" >/dev/null
          sips -s format bmp "$frames/ios-release+2s.png" --out "$RUNNER_TEMP/frame-b.bmp" >/dev/null
          total=$(stat -f%z "$RUNNER_TEMP/frame-a.bmp")
          # `cmp -l` EXITS 1 when the files differ — which is precisely the case we
          # are counting — so it is inside a group whose status is discarded: under
          # `set -e` with `pipefail` (this workflow sets both) the bare pipeline
          # aborted the step with no message at all. Verified locally against a
          # differing pair before pushing.
          differing=$( { cmp -l "$RUNNER_TEMP/frame-a.bmp" "$RUNNER_TEMP/frame-b.bmp" || true; } | head -200000 | wc -l | tr -d ' ')
          pct=$(awk -v d="$differing" -v t="$total" 'BEGIN { printf "%.2f", (d / t) * 100 }')
          echo "settle: $differing of $total bytes of the decoded frame differ between t+5s and t+7s (${pct}%, capped at 200000)"
          {
            echo
            echo "| iOS frame | value |"
            echo "|---|---|"
            echo "| differs from the pre-install home screen | yes (asserted) |"
            echo "| javascript fatals in the launch log | none (asserted) |"
            echo "| settle delta, t+5s vs t+7s | ${pct}% of the decoded frame's bytes, header included (reported, not asserted) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # The one content signal available without the harness: a JS bundle that
          # failed to load leaves a fatal in the simulator log while still painting
          # a red error screen, which would pass the baseline comparison above.
          #
          # THE READ HAS TO SUCCEED BEFORE ITS CONTENTS MEAN ANYTHING. This used to be
          # a single pipeline whose output was the `if` condition, so a `log show`
          # that failed made the grep find nothing and the step pass: fatal present
          # plus rc=1 read as "no fatal" (review Q5, measured). So the log is read to
          # a file first, with its status checked, and only then grepped.
          if ! xcrun simctl spawn "$udid" log show --last 60s --style compact > "$RUNNER_TEMP/launch.log" 2> "$RUNNER_TEMP/launch.log.err"; then
            echo "::error::could not read the simulator's launch log, so 'no JavaScript fatal' cannot be claimed either way:"
            cat "$RUNNER_TEMP/launch.log.err"
            exit 1
          fi
          if grep -E 'Unhandled JS Exception|RCTFatal' "$RUNNER_TEMP/launch.log" > "$RUNNER_TEMP/js-fatal.txt"; then
            echo "::error::the app logged a JavaScript fatal while launching, so the frame it painted is an error screen:"
            cat "$RUNNER_TEMP/js-fatal.txt"
            exit 1
          fi

      - name: Upload the frame and the simulator build
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: |
            ${{ runner.temp }}/frames/*.png
            ${{ runner.temp }}/DerivedData/Build/Products/Release-iphonesimulator/*.app
          retention-days: 14

      - name: Assert the native project regenerates identically
        # ADR 0004: continuous native generation is the source of truth, so the
        # project that was built must be exactly what the config and its plugins
        # produce. This notices when someone "fixes" a generated file, because
        # that fix is what the next `prebuild --clean` discards.
        run: |
          set -euo pipefail
          pnpm exec expo prebuild --platform ios --clean --no-install
          node scripts/ci/prebuild-determinism.ts \
            --built "$RUNNER_TEMP/ios-built" \
            --regenerated ios

  credentials:
    # ONE POLICY, BOTH PLATFORMS (review M3, QA Q2). Without Apple credentials
    # there is no signed IPA and no TestFlight upload, so the job that would
    # produce them is SKIPPED — visible in the job list as a skip, never a green
    # tick on a job that signed nothing — and this job's annotation says why.
    # `--mode internal` warns rather than failing, which is what makes the skip the
    # caller's decision here and a hard failure inside a release run.
    name: Are the Apple credentials configured?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # THE SAME ENVIRONMENT, AND THE SAME REF SCOPE, AS THE JOB IT GATES. This job
    # exists to ask whether the secrets are configured, which means it has to read
    # them — so it must sit behind the same protection as the signing job, or the
    # claim in this workflow's header ("not even resolved for a job whose ref the
    # environment's deployment-branch rule does not allow") stops being true of the
    # workflow as a whole (review round 3, M2; measured: it ran and passed on the
    # pull-request runs 36755424255 and 36755424075, outside any environment).
    #
    # `if:` as well as `environment:`, because the internal job is `main`-only: on a
    # pull request there is nothing for this gate to decide, and resolving secrets
    # to answer a question whose answer cannot change the run is cost with no
    # benefit. So on a pull request this job does not run, and no secret is resolved
    # anywhere in this workflow.
    #
    # WHAT THE ENVIRONMENT BUYS depends on how the operator configures it, and the
    # repository has NO environments configured today — so right now it is a no-op
    # and the secrets are repository-scoped (docs/ci.md, "Secrets"). Once `release`
    # exists with a `main`/`v*` deployment-branch rule, the credentials stored in it
    # are unreachable from a feature branch. If it is given required reviewers, this
    # job will wait for approval BEFORE it can report — the same prompt the signing
    # job already triggers, twice per release rather than once. A review-free
    # environment with the same branch rule avoids that at no loss.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: release
    outputs:
      all_present: ${{ steps.check.outputs.all_present }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the signing and upload credentials, by name
        id: check
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_ASC_PRIVATE_KEY_BASE64 }}
        run: |
          node scripts/ci/check-secrets.ts --mode internal --need \
            APPLE_TEAM_ID,APPLE_ASC_KEY_ID,APPLE_ASC_ISSUER_ID,APPLE_ASC_PRIVATE_KEY_BASE64

  internal:
    name: iOS internal release (signed IPA, TestFlight when configured)
    needs: [changes, ios, credentials]
    # Only a push to `main`. Never a pull request, never a tag (release.yml owns
    # those) — see the header for why the credentials are scoped to this job.
    #
    # AND THE CREDENTIALS MUST EXIST, or the job does not run at all: every step
    # below signs or uploads, and a job that skipped them while concluding
    # `success` would claim an artefact it never built (QA Q2). The same shape gates
    # the Android job, so the two platforms cannot disagree about what "no
    # credentials" means on the same push.
    if: needs.changes.outputs.native == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.credentials.outputs.all_present == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    # Where the Apple credentials live, and where required reviewers can be
    # configured once there is more than one maintainer (ADR 0004). The
    # environment's deployment-branch rule must list `main` and `v*` — that rule
    # is what makes the key unreachable from a feature branch.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count of this ref.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive the version from the ref
        # On `main` this is the placeholder version with a commit-count build
        # number: both stores compare the build number, and the placeholder is
        # what a non-release build is allowed to be. See docs/ci.md.
        run: node scripts/ci/version.ts --write

      - name: Assert the signing credentials are present
        # Belt and braces: the job is only reached when the `credentials` job found
        # all of them, and this fails hard rather than warning, so an edit that
        # loosens the gate cannot turn into a silently unsigned build.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_ASC_PRIVATE_KEY_BASE64 }}
        run: |
          node scripts/ci/check-secrets.ts --mode release --need \
            APPLE_TEAM_ID,APPLE_ASC_KEY_ID,APPLE_ASC_ISSUER_ID,APPLE_ASC_PRIVATE_KEY_BASE64

      - name: Generate the native project
        env:
          # `app.config.ts` reads the team id from here into `ios.appleTeamId`, so
          # the generated Xcode project has automatic signing pointed at the right
          # team without the value being committed to a public repository. The step
          # below asserts that path really is wired (review M4), because a secret in
          # a step's environment that no file reads is a defect this pipeline has
          # been reviewed for twice.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Assert the team id reached the app config
        # The load-bearing half of M4: it is not enough to set APPLE_TEAM_ID in a
        # step's environment, the app config has to consume it, so this reads the
        # config back the same way Expo does and fails if the two are not equal.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          resolved=$(pnpm exec expo config --json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ios",{}).get("appleTeamId",""))')
          echo "ios.appleTeamId resolves to '$resolved'"
          if [ "$resolved" != "$APPLE_TEAM_ID" ]; then
            echo "::error::the app config does not carry APPLE_TEAM_ID (got '$resolved'), so the generated project would sign against whatever team Xcode guesses"
            exit 1
          fi

      - name: Install the pods
        run: cd ios && pod install

      - name: Resolve the workspace and scheme
        id: project
        # Resolved rather than written down: `expo prebuild` names the workspace
        # and scheme after the app's sanitised name, and a second copy of that
        # name here is a copy that can disagree with app.config.ts. The script
        # also fails loudly when there is no workspace (which means `pod install`
        # never ran) or when the project declares more than one scheme.
        run: node scripts/ci/ios-project.ts --root ios

      - name: Decode the App Store Connect API key
        env:
          APPLE_ASC_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc-api-key.p8"
          # A key that is not a key is the failure that wastes an hour, so it is
          # caught here where the message can name the secret.
          openssl pkey -in "$RUNNER_TEMP/asc-api-key.p8" -noout -check

      - name: Write the export options
        # Generated rather than committed, because the team id is part of it and
        # a committed file would either carry a team id in a public repository or
        # a placeholder that cannot work.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive and export the IPA
        id: export
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc-api-key.p8"
          xcodebuild \
            -workspace "${{ steps.project.outputs.workspace }}" \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$APPLE_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$APPLE_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID"
          find "$RUNNER_TEMP/ipa" -name "*.ipa" -print

      - name: Upload the IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight (fastlane)
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          # The directory, not a filename: xcodebuild names the IPA after the
          # app, and the lane finds it rather than being told a name a rename
          # would break.
          LO_IOS_IPA_DIR: ${{ runner.temp }}/ipa
        run: fastlane ios testflight

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Say what was built, checked and uploaded
        if: always()
        run: |
          {
            echo "## iOS internal release"
            echo
            echo "This job runs only when every Apple credential is configured (its"
            echo "\`credentials\` job decides), so every step below signed or uploaded:"
            echo "there is no branch here in which it silently builds unsigned."
            echo
            echo "- signed IPA: ${{ steps.export.outcome == 'success' && 'built and attached to this run' || '**NOT verified** — the archive/export step did not pass' }}"
            echo "- TestFlight: uploaded by the step above"
          } >> "$GITHUB_STEP_SUMMARY"
