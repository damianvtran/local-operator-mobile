name: Capture history diagnostic

# Manual only: this is evidence collection, never a substitute for CI or a
# required check. A separate workflow avoids re-running mobile/product QA just
# to compare two rasterizer histories. Review and merge before first dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          # Frozen PR313 product tree. Only the two observer tool files below
          # are overlaid; captions, fonts, images and thresholds remain original.
          ref: 175e67064cfba95f127fc89cc46a032a1894b630
          path: subject
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install the existing design gate decoder
        run: brew install imagemagick
      - name: Record source identity and install observation-only tooling
        run: |
          set -euo pipefail
          mkdir -p subject/design/store-screenshots/out/diagnostic
          {
            git -C tooling rev-parse HEAD
            git -C subject rev-parse HEAD
            node --version
            magick --version
            /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version
            shasum -a 256 subject/design/preview/capture.mjs tooling/design/preview/capture.mjs
          } > subject/design/store-screenshots/out/diagnostic/provenance.txt
          cp tooling/design/preview/capture.mjs subject/design/preview/capture.mjs
          cp tooling/design/preview/capture-diagnostic.mjs subject/design/preview/capture-diagnostic.mjs
          git -C subject diff -- design/preview/capture.mjs > subject/design/store-screenshots/out/diagnostic/observer.patch
          git -C subject status --short >> subject/design/store-screenshots/out/diagnostic/provenance.txt
      - name: One representative pair in each original render history
        working-directory: subject
        shell: bash
        run: |
          set -uo pipefail
          out="$PWD/design/store-screenshots/out/diagnostic"
          verdict=0
          # A new process/profile for each history, on the SAME runner. No
          # retries: both original exit codes survive into the final red verdict.
          for history in all frames; do
            mkdir -p "$out/$history" "$RUNNER_TEMP/capture-$history/home" "$RUNNER_TEMP/capture-$history/tmp"
            (
              for name in ${!CMUX_@}; do unset "$name"; done
              export HOME="$RUNNER_TEMP/capture-$history/home"
              export TMPDIR="$RUNNER_TEMP/capture-$history/tmp"
              export LOCAL_OPERATOR_SCRATCHPAD="$RUNNER_TEMP/capture-$history"
              node design/preview/capture.mjs --target "$history" --check --diagnostic-dir "$out/$history"
            ) 2>&1 | tee "$out/$history/capture.log"
            status=${PIPESTATUS[0]}
            echo "$status" > "$out/$history/exit-code.txt"
            if [ "$status" -ne 0 ]; then verdict=1; fi
          done
          exit "$verdict"
      - name: Retain pixels even when the capture verdict is red
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-history-diagnostic
          path: subject/design/store-screenshots/out/diagnostic/
          if-no-files-found: error
          retention-days: 30
