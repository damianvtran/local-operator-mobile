name: Archive and verify a manually signed iOS IPA
description: >
  Import an existing distribution identity, download an existing App Store
  profile read-only, sign only the app target, and verify the exported IPA.
  No upload, certificate creation or device registration occurs here.
inputs:
  workspace:
    description: Generated CocoaPods workspace
    required: true
  scheme:
    description: Resolved app scheme
    required: true
  profile-name:
    description: Exact existing App Store provisioning profile name
    required: true
runs:
  using: composite
  steps:
    # Credentials arrive through the caller's environment, never shell-expanded
    # action inputs. Fail closed before spending time on a signed archive.
    - name: Check the manual signing prerequisites
      shell: bash
      run: |
        set -euo pipefail
        node scripts/ci/check-secrets.ts --mode release --need APPLE_TEAM_ID,APPLE_ASC_KEY_ID,APPLE_ASC_ISSUER_ID,APPLE_ASC_PRIVATE_KEY_BASE64,APPLE_DIST_CERT_P12_BASE64,APPLE_DIST_CERT_PASSWORD
        fastlane --version

    - name: Prepare the ephemeral signing keychain
      id: signing
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        dir=$(mktemp -d "$RUNNER_TEMP/lo-ios-signing.XXXXXX")
        echo "directory=$dir" >> "$GITHUB_OUTPUT"
        export LO_IOS_SIGNING_DIR="$dir"
        python3 scripts/ci/ios-signing.py prepare

    - name: Download the existing profile and scope manual signing to the app
      shell: bash
      env:
        LO_IOS_SIGNING_DIR: ${{ steps.signing.outputs.directory }}
        LO_IOS_PROFILE_NAME: ${{ inputs.profile-name }}
      run: fastlane ios prepare_distribution

    - name: Archive, export and verify the distribution IPA
      shell: bash
      env:
        LO_IOS_SIGNING_DIR: ${{ steps.signing.outputs.directory }}
        LO_IOS_WORKSPACE: ${{ inputs.workspace }}
        LO_IOS_SCHEME: ${{ inputs.scheme }}
        LO_IOS_PROFILE_NAME: ${{ inputs.profile-name }}
      run: |
        set -euo pipefail
        python3 scripts/ci/ios-signing.py profile
        # Build settings live on the application target. Global signing overrides
        # here would also sign Pods targets with the app's provisioning profile.
        xcodebuild -workspace "$LO_IOS_WORKSPACE" -scheme "$LO_IOS_SCHEME" \
          -configuration Release -destination 'generic/platform=iOS' \
          -archivePath "$LO_IOS_SIGNING_DIR/App.xcarchive" archive
        xcodebuild -exportArchive -archivePath "$LO_IOS_SIGNING_DIR/App.xcarchive" \
          -exportOptionsPlist "$LO_IOS_SIGNING_DIR/ExportOptions.plist" \
          -exportPath "$RUNNER_TEMP/ipa"
        python3 scripts/ci/ios-signing.py verify

    - name: Always remove signing credentials and restore keychains
      if: always()
      shell: bash
      env:
        LO_IOS_SIGNING_DIR: ${{ steps.signing.outputs.directory }}
      run: python3 scripts/ci/ios-signing.py cleanup
