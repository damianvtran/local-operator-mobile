# Password remains blank: production runTunnelTest calls sessions(), not login.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: "custom-url-field"
    direction: ${FIELD_DIRECTION}
    timeout: 15000
- tapOn:
    id: "custom-url-field"
- eraseText: 1000
- inputText: ${PROBE_URL}
- tapOn:
    text: "return"
- assertNotVisible:
    text: "return"
- assertVisible: ${PROBE_URL}
- scrollUntilVisible:
    element:
      id: "custom-insecure-opt-in"
    direction: DOWN
    timeout: 15000
- runFlow:
    when:
      visible: "Allow a plain http:// address"
    commands:
      - tapOn:
          id: "custom-insecure-opt-in"
- assertVisible: "Plain http:// is allowed"
- scrollUntilVisible:
    element:
      id: "own-tunnel-test"
    direction: DOWN
    timeout: 15000
- evalScript: ${output.transportStarted = Date.now()}
- tapOn:
    id: "own-tunnel-test"
- extendedWaitUntil:
    visible:
      id: "own-tunnel-test"
      enabled: true
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "(?s)(That password was not accepted.*|That address did not answer.*|That host name.*|The address could not be reached.*|That tunnel's certificate.*|Nothing answered.*)"
    direction: DOWN
    timeout: 15000
- copyTextFrom:
    text: "(?s)(That password was not accepted.*|That address did not answer.*|That host name.*|The address could not be reached.*|That tunnel's certificate.*|Nothing answered.*)"
- runScript:
    file: transport-observation.js
    env:
      AUTHORITY_LABEL: ${AUTHORITY_LABEL}
- takeScreenshot: transport-${AUTHORITY_LABEL}
