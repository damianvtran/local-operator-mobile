# Prerequisite only: no picker/theme acceptance and no device fanout.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow: connect-relay-ios.yaml
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- takeScreenshot: diagnostic-home
- tapOn:
    id: "home-sidebar"
- extendedWaitUntil:
    visible:
      id: "session-row-6714def86197"
    timeout: 30000
- takeScreenshot: diagnostic-sidebar
