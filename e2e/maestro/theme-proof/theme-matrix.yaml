# The theme proof's one walk (decision record § 7, PR 2 frames): the Theme
# picker in each mode, a search, the selected card, and home + session in seven
# themes. ONE connection, then every theme is applied through the picker the
# reader uses — a card tap — so the frames prove the real path, not a seeded
# preference. The search frame is taken with the keyboard up, as a reader sees
# it; no keyboard key is tapped (iOS key labels are not app ids, and the
# connect helper documents how fragile they are). Every capture is preceded by an assertion that the state it
# claims is on screen (the selected card, the screen root), and the runner
# refuses an incomplete frame set.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow: connect-relay-ios.yaml
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- tapOn:
    id: "settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "settings-theme-row"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings-theme-row"
- extendedWaitUntil:
    visible:
      id: "theme-picker-screen"
    timeout: 15000
- tapOn:
    id: "theme-picker-mode-system"
- extendedWaitUntil:
    visible:
      id: "theme-picker-mode-system"
      selected: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: picker-mode-system
- tapOn:
