# Both authorities, one app launch, same simulator/process/relay port. No Save.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000
- tapOn:
    id: "welcome-custom-url"
- extendedWaitUntil:
    visible:
      id: "own-tunnel-screen"
    timeout: 15000
- runFlow:
    file: transport-attempt.yaml
    env:
      PROBE_URL: ${TRANSPORT_LOOPBACK}
      AUTHORITY_LABEL: loopback-ipv4
      FIELD_DIRECTION: DOWN
- runFlow:
    file: transport-attempt.yaml
    env:
      PROBE_URL: ${TRANSPORT_LOCAL}
      AUTHORITY_LABEL: published-local
      FIELD_DIRECTION: UP
