# PROOF-OWNED copy of ../projects-create-proof/connect-relay-ios.yaml for the
# chrome proof ONLY (scripts/ci/chrome-ios-proof.ts), so neither proof's walk can
# drift the other's. Unchanged below this header.
#
# PROOF-OWNED iOS variant of `helpers/connect-relay.yaml`.
#
# WHY THIS FILE EXISTS. The base helper (commit 193d79b, PR #86) is consumed by
# eight base Android flows (`flows/02..09`) and is exercised on ANDROID only —
# the base iOS e2e job is explicitly deferred for cost. Its two `hideKeyboard`
# steps therefore never ran on iOS, and Maestro 2.11.0 does not support
# `hideKeyboard` on iOS at all. Our lane hit it first: run 38854849272 walked the
# real own-tunnel path (welcome screen, custom-url tap, own-tunnel screen, URL
# input ALL COMPLETED) and then failed `Hide Keyboard` with Maestro's own advice
# — "Instead of hideKeyboard, try tapping on non-interactive element to hide
# keyboard."
#
# So each `hideKeyboard` becomes a tap on static, NON-INTERACTIVE text: the
# screen's own title, "Your own tunnel" — the element the page already draws, not
# an invented control and not a shrunken/slept delay. Every id, wait, opt-in and
# the real `Connected` verdict are unchanged from the base helper; the flow still
# launches with clearState and still proves the real path end to end.
#
# UPSTREAM CANDIDATE. This is a real base-repo iOS portability gap, not ours to
# silently duplicate forever: once the base iOS e2e lane runs again and can
# re-verify on Android, the tap-on-static-text form should be folded back into
# `helpers/connect-relay.yaml` and this file removed.
appId: ${APP_ID}
---
# COLD budget (78000ms): this is the FIRST assertion after the caller's
# `launchApp: {clearState: true}`, so it waits on the app's own cold launch and
# first paint. Measured 25869ms for the launch alone (run 38853165349,
# `warm-launch-base-app`, rc0 — run 38854849272 measured 23286ms for the same step);
# it is the proof's derived `capFor("coldAppLaunch")`.
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 78000
- tapOn:
    id: "welcome-custom-url"
- extendedWaitUntil:
    visible:
      id: "own-tunnel-screen"
    timeout: 15000
# The command guide precedes the form. Scroll at the device's actual font scale;
# shrinking accessibility text or sleeping would hide a real user-path failure.
- scrollUntilVisible:
    element:
      id: "custom-url-field"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "custom-url-field"
- inputText: ${RELAY_URL}
# iOS keyboard dismissal: the on-screen Return key, selected by its accessibility
# text `return` (its `Return` resource-id is an OS id, not an app id, and
# src/ui/a11y.e2e.test.ts rejects flow ids the app never renders). Tapping the "Your own tunnel"
# text (the account-routing helper's form) does NOT blur a TextInput here: run
# 41581513521's hierarchy still held `Return`/`inputView` afterwards, and the
# keyboard then swallowed the opt-in taps as typed `y`s (URL ended `…49515yy`).
# `hideKeyboard` stays unusable on iOS (Maestro 2.11.0). Each dismissal asserts
# the keyboard is gone, and the URL is asserted EXACT (Maestro matches the whole
# text), so a corrupted field fails here with the failure capture.
- tapOn:
    text: "return"
- assertNotVisible:
    text: "return"
- assertVisible: ${RELAY_URL}
- scrollUntilVisible:
    element:
      id: "custom-password-field"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "custom-password-field"
- inputText: ${RELAY_PASSWORD}
- tapOn:
    text: "return"
- assertNotVisible:
    text: "return"
- scrollUntilVisible:
    element:
      id: "custom-insecure-opt-in"
    direction: DOWN
    timeout: 15000
# The opt-in is a toggle Button whose LABEL carries its state ("Allow a plain
# http:// address" off, "Plain http:// is allowed" on; own-tunnel.tsx). Run 2
# (41569220308) showed the tap COMPLETED yet the form still refusing http://, so
# the state is asserted instead of trusted. Tap once; if the on-label is
# absent fail fast. No retry tap: a retry cannot be told from a toggle-off, and
# the earlier retry is what typed into the URL field.
- tapOn:
    id: "custom-insecure-opt-in"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Plain http:// is allowed"
- scrollUntilVisible:
    element:
      id: "own-tunnel-test"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "own-tunnel-test"
# OwnTunnel disables Save until runTunnelTest admits the password and reads the
# sessions endpoint. This verdict is its real success title, not a form label.
- scrollUntilVisible:
    element:
      text: "Connected"
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Connected"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "custom-connect"
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "custom-connect"
      enabled: true
    timeout: 15000
- tapOn:
    id: "custom-connect"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
