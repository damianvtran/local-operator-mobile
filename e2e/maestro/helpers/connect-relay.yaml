# Native CI starts with no credentials; -e values are not app configuration.
# Walk the reader's own-tunnel path, including its real login + sessions probe.
# This helper lives outside flows/*.yaml so it never runs as a standalone test.
# HTTP is permitted explicitly for the isolated CI mock, never for a real account.
appId: ${APP_ID}
---
# COLD budget, not the steady 15s: this is the FIRST assertion after the caller's
# `launchApp: {clearState: true}`, so it waits on the app's own cold launch and
# first paint. That launch measured 25869ms on run 38853165349 (`warm-launch-base-app`,
# rc0) and this wait failed at 15000ms while the rendered frame shows the screen HAD
# drawn — the budget, not the app, was the defect. The value is the proof's derived
# `capFor("coldAppLaunch")` (25869ms x 3, floored at 60s); a control asserts this
# line and that derivation agree, so the two cannot drift apart.
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 78000
- tapOn:
    id: "welcome-custom-url"
- extendedWaitUntil:
    visible:
      id: "own-tunnel-screen"
    timeout: 15000
# The command guide precedes the form. Scroll at the device's actual font scale;
# shrinking accessibility text or sleeping would hide a real user-path failure.
- scrollUntilVisible:
    element:
      id: "custom-url-field"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "custom-url-field"
- inputText: ${RELAY_URL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "custom-password-field"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "custom-password-field"
- inputText: ${RELAY_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "custom-insecure-opt-in"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "custom-insecure-opt-in"
- scrollUntilVisible:
    element:
      id: "own-tunnel-test"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "own-tunnel-test"
# OwnTunnel disables Save until runTunnelTest admits the password and reads the
# sessions endpoint. This verdict is its real success title, not a form label.
- scrollUntilVisible:
    element:
      text: "Connected"
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Connected"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "custom-connect"
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "custom-connect"
      enabled: true
    timeout: 15000
- tapOn:
    id: "custom-connect"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
