# F-5 — the session list, including the states the relay can be in.
#
# The list is driven by the mock relay's `sessions` scenario, so this flow runs
# once per state in CI rather than hoping to catch one live. The states it asserts
# are the ones `docs/relay/contract.md` §7 names and the rubric's S4 row scores:
# empty, populated, needs-attention, and degraded.
#
# `subagents_running: null` is the relay's unreachable-runtime signal and is
# deliberately *not* zero — the assertion below is what stops a screen from
# painting "0 subagents" over a runtime it cannot vouch for.
appId: ${APP_ID}
name: "F-5 session list"
env:
  APP_ID: com.radient.localoperator.mobile
  SESSION_ID: 6714def86197
---
- launchApp:
    clearState: true
- runFlow: "01-first-run-sign-in.yaml"
---
- assertVisible:
    id: "session-list"
- takeScreenshot: "05-00-list"
- assertVisible:
    id: "session-row-${SESSION_ID}"
- takeScreenshot: "05-01-row"
# Sections: pinned / active / previous. The relay pre-orders rows and the client
# must not re-sort, so the assertion is on the rendered order, not on a sort.
- assertVisible:
    id: "session-section-active"
- assertVisible:
    id: "session-section-previous"
- takeScreenshot: "05-02-sections"
- tapOn:
    id: "session-search-button"
- takeScreenshot: "05-03-search-open"
- inputText: "hello"
- takeScreenshot: "05-04-search-results"
- assertVisible:
    id: "search-result-body-match-marker"
- back
- takeScreenshot: "05-05-list-again"
- scrollUntilVisible:
    element:
      id: "session-row-${SESSION_ID}"
    direction: DOWN
- takeScreenshot: "05-06-scrolled-to-row"
