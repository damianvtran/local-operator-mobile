# F-5 — the conversations panel (the session list's home since the Part 2 slice).
#
# `/` is the composer home now; the list lives behind `home-sidebar` as a
# temporary panel (and as a docked pane on a tablet). The states this flow
# asserts are the ones the rubric's S15 row scores: empty, populated,
# search, and the section vocabulary — driven by the mock relay's
# `sessions` scenario, so CI can run it once per state rather than hoping to
# catch one live.
#
# The panel's loading state carries its own marker (`sidebar-loading`, R-2:
# loading and empty were byte-identical frames, both markerless, and neither a
# reader nor the machine could tell them apart).
#
# `subagents_running: null` is the relay's unreachable-runtime signal and is
# deliberately not zero. A row that paints "0 subagents" over a runtime it
# cannot vouch for is the defect the populated assertion below exists to catch.
#
# IDENTIFIERS: every `id:` in this file is in `src/ui/a11y.ts` — the contract
# this repo owns, which `src/ui/a11y.e2e.test.ts` checks these flows against. A
# step the app cannot serve yet is a commented marker, not a selector, and there
# are three spellings because there are three different gaps:
#
#     Marker spelling: `# BLOCKED: needs <the-identifier> from <the-screen>`
#     Marker spelling: `# PENDING: <the-identifier> from <the-screen>`
#     Marker spelling: `# SCENARIO: <the-identifier> from <the-screen>`
#
# `BLOCKED` names an id `src/ui/a11y.ts` does not declare at all; `PENDING` names
# one the contract declares whose renderer is not on this branch; `SCENARIO`
# names one the app DOES render, where what is missing is the mock relay pinned
# to the scenario that produces the state it waits on (`--scenario …`). The test
# checks each in its own direction, so no marker can hide coverage: a `BLOCKED`
# id must be absent from the contract, a `PENDING` id must be declared and
# unrendered, and a `SCENARIO` id must be declared and rendered. An invented
# selector would fail on the first assertion and read as a flaky flow.
#
# CI-only: needs a booted simulator or emulator and an app build (ADR 0003).
appId: ${APP_ID}
name: "F-5 conversations panel"
env:
  APP_ID: com.radient.localoperator.mobile
  SESSION_ID: 6714def86197
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- assertVisible:
    id: "home-greeting"
- takeScreenshot: "05-00-home"
# The panel is an overlay: opened by the home's own affordance, closed back to
# the composer. Both halves are asserted — a panel with no way back would be a
# destination, and this one is explicitly not.
- tapOn:
    id: "home-sidebar"
- extendedWaitUntil:
    visible:
      id: "conversations-sidebar"
    timeout: 10000
- takeScreenshot: "05-01-panel-open"
- assertVisible:
    id: "sessions-empty"
- assertVisible:
    id: "sessions-new-action"
- takeScreenshot: "05-02-empty-state"
# The search affordance is rendered, and its field appears on the tap, so that
# half of the header is assertable with no scenario pin: a search control that
# does nothing when pressed is exactly what this pair of steps catches.
- tapOn:
    id: "sidebar-search"
- assertVisible:
    id: "sidebar-search-field"
- takeScreenshot: "05-03-search"
# Rows and sections need the list populated, which needs the relay pinned to a
# session scenario. The identifiers are rendered today; the state is not
# reachable without it.
# SCENARIO: session-row-<id> from sessions
# - assertVisible:
#     id: "session-row-${SESSION_ID}"
# SCENARIO: sidebar-section-running from sessions
# - assertVisible:
#     id: "sidebar-section-running"
# SCENARIO: sidebar-section-today from sessions
# - assertVisible:
#     id: "sidebar-section-today"
- tapOn:
    id: "sidebar-close"
- assertVisible:
    id: "home-screen"
