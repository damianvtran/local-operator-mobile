# F-7/S6 — drill into a subagent and back.
#
# The roster on the projection is *stripped* (prompt, result, transcript and todos
# emptied) and re-materialised only on the detail route, so this flow is also the
# check that the app fetches the detail rather than rendering empty fields from the
# roster: the assertions are on content that only exists on the detail route.
#
# Neither the roster nor the detail content exists yet. The subagent screen's own
# root and back control do, and they are the two things asserted here.
#
# IDENTIFIERS: every `id:` in this file is in `src/ui/a11y.ts` — the scaffold's
# own contract, which `src/ui/a11y.e2e.test.ts` checks these flows against. A step
# the app cannot serve yet is a commented marker, not a selector:
#
#     Marker spelling: `# BLOCKED: needs <the-identifier> from <the-screen>`
#
# The marker names the identifier a step waits on and the screen that would own
# it, so the gap is visible in review and the test can require that every marked
# id is genuinely one the app does not render. An invented selector would fail on
# the first assertion and read as a flaky flow.
#
# CI-only: needs a booted simulator or emulator and an app build (ADR 0003).
appId: ${APP_ID}
name: "F-7 subagent drill-down"
env:
  APP_ID: com.radient.localoperator.mobile
  SESSION_ID: 6714def86197
  JOB_ID: job-1
---
- launchApp:
    clearState: true
# BLOCKED: needs subagent-chip-<job> from session
# - tapOn:
#     id: "subagent-chip-${JOB_ID}"
# BLOCKED: needs subagent-detail-prompt from subagent
# - assertVisible:
#     id: "subagent-detail-prompt"
# BLOCKED: needs subagent-detail-transcript from subagent
# - assertVisible:
#     id: "subagent-detail-transcript"
# BLOCKED: needs subagent-detail-todos from subagent
# - scrollUntilVisible:
#     element:
#       id: "subagent-detail-todos"
#     direction: DOWN
- assertVisible:
    id: "sessions-screen"
