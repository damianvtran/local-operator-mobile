# F-9/S13 — connection loss, and the recovery the user must not see.
#
# Run against the mock relay with `--fault sse-cut-after=6`, the tunnel gateway's
# `MAX_STREAM_SECONDS` cap compressed into a few seconds: the stream ends as a clean
# end-of-body, with no error frame and no status change, so an early EOF carries no
# information about why it ended (`docs/relay/tunnel-edge.md` §3). What the app must
# do with that is the whole point:
#
#   1. treat EOF as expected, not as an error,
#   2. reconnect immediately and render the seed frame,
#   3. **not** show a connection state on the boundary — a user must not see a
#      reconnect flash every minute,
#   4. keep the last good projection rendered while reconnecting, never blank.
#
# The stream exists on this branch (`src/relay/sse.ts`, driven by the provider's
# `startStream`), so (1)–(2) are asserted by the relay's own tests and the fault
# injection below. What is still missing is the SURFACE that would show (3)–(4) to a
# reader: the session view is the session stream's, so the identifiers this flow waits
# on are `PENDING` — declared in the contract, built by nothing here.
#
# IDENTIFIERS: every `id:` in this file is in `src/ui/a11y.ts` — the contract this
# branch owns, which `src/ui/a11y.e2e.test.ts` checks these flows against. A step the
# app cannot serve yet is a commented marker, not a selector, and there are three
# spellings because there are three different gaps:
#
#     Marker spelling: `# BLOCKED: needs <the-identifier> from <the-screen>`
#     Marker spelling: `# PENDING: <the-identifier> from <the-screen>`
#     Marker spelling: `# SCENARIO: <the-identifier> from <the-screen>`
#
# `BLOCKED` names an id `src/ui/a11y.ts` does not declare at all; `PENDING` names one
# the contract declares whose renderer is not on this branch (the session view's, which
# lands with its own stream); `SCENARIO` names one the app DOES render, where what is
# missing is the mock relay pinned to the scenario that produces the state it waits on
# (`--scenario …`). The test checks each in its own direction, so no marker can hide
# coverage: a `BLOCKED` id must be absent from the contract, a `PENDING` id must be
# declared and unrendered, and a `SCENARIO` id must be declared and rendered. An
# invented selector would fail on the first assertion
# and read as a flaky flow.
#
# CI-only: needs a booted simulator or emulator and an app build (ADR 0003).
appId: ${APP_ID}
name: "F-9 connection loss and silent recovery"
env:
  APP_ID: com.radient.localoperator.mobile
  SESSION_ID: 6714def86197
---
- launchApp:
    clearState: true
- assertVisible:
    id: "home-screen"
# SCENARIO: connection-banner from session
# - assertNotVisible:
#     id: "connection-banner"
# BLOCKED: needs reconnect-toast from session — the contract has a `toast`
# (`CONTROL.toast`, rendered by `ToastHost`); nothing declares a toast specific to a
# reconnect, which is the distinction the step is about.
# - assertNotVisible:
#     id: "reconnect-toast"
# SCENARIO: session-transcript from session
# - assertVisible:
#     id: "session-transcript"
# SCENARIO: composer-receipt from session
# - assertVisible:
#     id: "composer-receipt"
