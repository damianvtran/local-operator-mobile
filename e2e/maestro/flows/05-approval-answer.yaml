# F-6/S8 — answer a pending approval, then a pending ask.
#
# The relay's `approval` and `ask` scenarios pin both card shapes, including the
# multi-question ask and the destructive-command detail. The flow answers one of
# each and asserts the card *leaves*: a card that stays after an answer is the
# defect that reads as a hung app.
#
# Both cards are unrendered in the scaffold — the projection store does not exist —
# so this flow currently carries markers only. It is kept as the specification of
# what the cards must be assertable by, which is what makes the gap trackable.
#
# IDENTIFIERS: every `id:` in this file is in `src/ui/a11y.ts` — the scaffold's
# own contract, which `src/ui/a11y.e2e.test.ts` checks these flows against. A step
# the app cannot serve yet is a commented marker, not a selector:
#
#     Marker spelling: `# BLOCKED: needs <the-identifier> from <the-screen>`
#
# The marker names the identifier a step waits on and the screen that would own
# it, so the gap is visible in review and the test can require that every marked
# id is genuinely one the app does not render. An invented selector would fail on
# the first assertion and read as a flaky flow.
#
# CI-only: needs a booted simulator or emulator and an app build (ADR 0003).
appId: ${APP_ID}
name: "F-6 approval and ask"
env:
  APP_ID: com.radient.localoperator.mobile
  SESSION_ID: 6714def86197
---
- launchApp:
    clearState: true
- assertVisible:
    id: "sessions-screen"
