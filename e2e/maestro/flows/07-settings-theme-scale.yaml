# S11/F-10 — settings, and the two appearance dimensions the audit scores.
#
# The theme switch is the shell's own feature — the one setting that needs no
# connection — so this flow is the native half of the evidence the web matrix
# captures: what the web harness proves about layout in both themes, this proves
# about the device render.
#
# Text scale is NOT wired: the scaffold has no scale preference, so the 200%
# assertions are markers. The matrix reports the same gap as an inert
# text-scale dimension rather than pretending three scales were rendered.
#
# IDENTIFIERS: every `id:` in this file is in `src/ui/a11y.ts` — the scaffold's
# own contract, which `src/ui/a11y.e2e.test.ts` checks these flows against. A step
# the app cannot serve yet is a commented marker, not a selector:
#
#     Marker spelling: `# BLOCKED: needs <the-identifier> from <the-screen>`
#
# The marker names the identifier a step waits on and the screen that would own
# it, so the gap is visible in review and the test can require that every marked
# id is genuinely one the app does not render. An invented selector would fail on
# the first assertion and read as a flaky flow.
#
# CI-only: needs a booted simulator or emulator and an app build (ADR 0003).
appId: ${APP_ID}
name: "S11 settings theme and text scale"
env:
  APP_ID: com.radient.localoperator.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "sessions-screen"
    timeout: 15000
- tapOn:
    id: "sessions-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- takeScreenshot: "11-00-settings"
- assertVisible:
    id: "settings-theme"
- assertVisible:
    id: "appearance-theme-system"
- takeScreenshot: "11-01-theme-control"
- tapOn:
    id: "appearance-theme-dark"
- takeScreenshot: "11-02-theme-dark"
- tapOn:
    id: "appearance-theme-light"
- takeScreenshot: "11-03-theme-light"
- tapOn:
    id: "appearance-theme-system"
- takeScreenshot: "11-04-theme-system"
- assertVisible:
    id: "settings-connection-empty"
- takeScreenshot: "11-05-connection-empty"
