# S11/F-10 — settings, and the two appearance dimensions the audit scores.
#
# The theme switch is the shell's own feature — the one setting that needs no
# connection — so this flow is the native half of the evidence the web matrix
# captures: what the web harness proves about layout in both themes, this proves
# about the device render.
#
# Both appearance dimensions are wired on this branch — the theme override and the
# text-scale preference (`CONTROL.settingsTheme*`, `CONTROL.settingsTextScale*`) — so
# the pre-fold flow's text-scale markers are real steps now, and the flow drives both
# and screenshots each step. That is the native half of the evidence the web matrix
# captures for the same two dimensions.
#
# IDENTIFIERS: every `id:` in this file is in `src/ui/a11y.ts` — the contract this
# branch owns, which `src/ui/a11y.e2e.test.ts` checks these flows against. A step the
# app cannot serve yet is a commented marker, not a selector, and there are three
# spellings because there are three different gaps:
#
#     Marker spelling: `# BLOCKED: needs <the-identifier> from <the-screen>`
#     Marker spelling: `# PENDING: <the-identifier> from <the-screen>`
#     Marker spelling: `# SCENARIO: <the-identifier> from <the-screen>`
#
# `BLOCKED` names an id `src/ui/a11y.ts` does not declare at all; `PENDING` names one
# the contract declares whose renderer is not on this branch (the session view's, which
# lands with its own stream); `SCENARIO` names one the app DOES render, where what is
# missing is the mock relay pinned to the scenario that produces the state it waits on
# (`--scenario …`). The test checks each in its own direction, so no marker can hide
# coverage: a `BLOCKED` id must be absent from the contract, a `PENDING` id must be
# declared and unrendered, and a `SCENARIO` id must be declared and rendered. An
# invented selector would fail on the first assertion
# and read as a flaky flow.
#
# CI-only: needs a booted simulator or emulator and an app build (ADR 0003).
appId: ${APP_ID}
name: "S11 settings theme and text scale"
---
- launchApp:
    clearState: true
- runFlow: ../helpers/connect-relay.yaml
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- tapOn:
    id: "settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- takeScreenshot: "11-00-settings"
# Connected custom routes put saved-tunnel management above Appearance. A ready
# Settings root is not a visible theme control: walk the real ScrollView targets.
- scrollUntilVisible:
    element:
      id: "settings-theme-group"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "settings-theme-group"
- scrollUntilVisible:
    element:
      id: "settings-theme-system"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "settings-theme-system"
- takeScreenshot: "11-01-theme-control"
- scrollUntilVisible:
    element:
      id: "settings-theme-dark"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings-theme-dark"
- extendedWaitUntil:
    visible:
      id: "settings-theme-dark"
      selected: true
    timeout: 15000
- takeScreenshot: "11-02-theme-dark"
- scrollUntilVisible:
    element:
      id: "settings-theme-light"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings-theme-light"
- extendedWaitUntil:
    visible:
      id: "settings-theme-light"
      selected: true
    timeout: 15000
- takeScreenshot: "11-03-theme-light"
- scrollUntilVisible:
    element:
      id: "settings-theme-system"
    direction: UP
    timeout: 15000
- tapOn:
    id: "settings-theme-system"
- extendedWaitUntil:
    visible:
      id: "settings-theme-system"
      selected: true
    timeout: 15000
- takeScreenshot: "11-04-theme-system"
# Connection precedes Appearance, so this return must go upward.
- scrollUntilVisible:
    element:
      id: "settings-section-connection"
    direction: UP
    timeout: 15000
- assertVisible:
    id: "settings-section-connection"
- takeScreenshot: "11-05-connection-section"
- scrollUntilVisible:
    element:
      id: "settings-text-scale-200"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings-text-scale-200"
# Larger text expands everything above this track. Re-find selected 200 DOWN
# after reflow before capturing it; only then is the earlier 100 option UP.
- scrollUntilVisible:
    element:
      id: "settings-text-scale-200"
      selected: true
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "settings-text-scale-200"
      selected: true
    timeout: 15000
- takeScreenshot: "11-06-text-200"
- scrollUntilVisible:
    element:
      id: "settings-text-scale-100"
    direction: UP
    timeout: 15000
- tapOn:
    id: "settings-text-scale-100"
# Returning to 100 contracts the preceding content and invalidates that offset
# again. Re-anchor UP before the reset screenshot, rather than capturing mid-flow.
- scrollUntilVisible:
    element:
      id: "settings-text-scale-100"
      selected: true
    direction: UP
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "settings-text-scale-100"
      selected: true
    timeout: 15000
- takeScreenshot: "11-07-text-100"
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "settings-sign-out"
- takeScreenshot: "11-08-sign-out"
# Diagnostics is above the sign-out tail, not farther down the page.
- scrollUntilVisible:
    element:
      id: "settings-section-diagnostics"
    direction: UP
    timeout: 15000
- assertVisible:
    id: "settings-section-diagnostics"
- takeScreenshot: "11-09-diagnostics"
