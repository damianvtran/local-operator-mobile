# Maestro workspace configuration for the native flow set.
#
# Run:  maestro test --config e2e/maestro/config.yaml e2e/maestro
#
# These flows cannot run on a development machine that has no Xcode and no
# Android SDK (ADR 0003, "Context", and the repository's own build-host rules),
# so they are **CI-only**: an iOS simulator on a macOS runner, an Android
# emulator on a KVM-enabled Linux runner. ADR 0004 wires the jobs; `docs/e2e/ci-notes.md`
# records how to invoke everything and what each artefact is.
#
# Every flow is parameterised, so the same YAML covers both platforms and both
# connection routes. Pass the values with `-e`:
#
#   maestro test --config e2e/maestro/config.yaml \
#     -e APP_ID=<the built app's id> \
#     -e RELAY_URL=http://127.0.0.1:<mock-port> \
#     -e RELAY_PASSWORD="$(cat "$RUN/relay-password")" \
#     -e SESSION_ID=6714def86197 \
#     e2e/maestro
#
# `APP_ID` has no default in any flow, deliberately: Maestro 2.11.0 applies a
# flow-level `env:` value after the CLI's `-e` values and overwrites them, so a
# default committed in a flow would silently launch the wrong bundle — the value
# comes from the invocation, and CI reads it out of the APK it just built.
#
# The relay password is never written into a flow. A flow that needed a literal
# secret could not be committed, so `RELAY_PASSWORD` arrives as an -e value from
# the CI job's own environment, which reads it out of a 0600 file it created.
flows:
  - "flows/*.yaml"

# One retry is allowed, per ADR 0003 §"Layer 4": a second failure is a failure.
# The retry lives on the CI invocation in `.github/workflows/e2e.yml` — the
# invocation re-runs the flow set once on failure; Maestro 2.11.0 has no CLI
# retry option — not here, because the CI job has to distinguish "flaked once"
# (marked `::warning`, still green) from "flaked twice" (failed) in its report.
